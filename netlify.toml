# =============================================================================
# netlify.toml — build configuration for Netlify
# =============================================================================
# Netlify reads this file to know how to build the site. Most things are
# auto-detected from the Gemfile, but pinning Ruby version + the build
# command makes the build deterministic.
# =============================================================================

[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.1.4"

# -----------------------------------------------------------------------------
# Headers — small UX/security tweaks for the admin route.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/admin/*"
  [headers.values]
    # Prevent the admin page from being framed by another site.
    X-Frame-Options = "DENY"
    # Never let the editor turn up in a search result.
    X-Robots-Tag = "noindex, nofollow, noarchive"

# The dashboard and the count it feeds the editor. Both are gated by the same
# Identity login as /admin/ (_includes/admin-gate.html), but that check runs in
# the browser, after Netlify has already served the file — so the one thing
# that can be enforced here is that neither is ever indexed. `sitemap: false`
# in the page front matter keeps them out of sitemap.xml; this keeps them out
# of the index even if someone links to one.
[[headers]]
  for = "/admin-stats/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/admin-upkeep.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

# Cache the search index for an hour in the browser. It's regenerated
# on every build, so its content changes when we publish — but between
# builds it's stable, and skipping the re-download on every search-page
# visit is a big perf win as the archive grows.
[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# -----------------------------------------------------------------------------
# Redirects
# -----------------------------------------------------------------------------
# The editor names a post's file when the post is created and never renames
# it afterwards, so retitling a post leaves the old words sitting in the URL
# forever. When we fix one of those by renaming the file, the old address is
# already out in the world — in the feed, in anything anyone saved or shared.
# A permanent redirect keeps those working.
#
# Add a pair here whenever a post is renamed. They cost nothing to keep.

# Retitled to the Napoleon quote; the file still said "blue skies, seaside,
# black tea", which is now a different post entirely. (2026-09-03)
[[redirects]]
  from = "/city-of-empires/blue-skies-seaside-black-tea/"
  to = "/city-of-empires/if-the-earth-were-a-single-state-istanbul-would-be-its-capital/"
  status = 301

# Published before it had a name, so the URL was literally /draft/. (2026-09-03)
[[redirects]]
  from = "/welcome-home-tbilisi-georgia/draft/"
  to = "/welcome-home-tbilisi-georgia/the-ananuri-fortress-a-friendship-monument-and-giant-heads/"
  status = 301

# Started life as a week summary, ended up being about the food. (2026-09-03)
[[redirects]]
  from = "/welcome-home-tbilisi-georgia/week-3-of-tbilisi/"
  to = "/welcome-home-tbilisi-georgia/sushi-sunsets-suluguni/"
  status = 301

# (2026-09-03)
[[redirects]]
  from = "/the-singaporean-stopover/dinos-donuts/"
  to = "/the-singaporean-stopover/donuts-the-goddess-and-destroyer-of-evil/"
  status = 301
