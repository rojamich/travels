<!--
  =============================================================================
  CUSTOM HEAD CONTENT
  =============================================================================
  Minimal Mistakes automatically includes this file inside <head> on every
  page. Use it for Google Fonts, favicons, analytics — anything that lives
  in <head>.
  =============================================================================
-->

<!-- Lora serif font for headings (free, hosted by Google) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

<!--
  Favicon — emoji (✈️) embedded as an SVG data URL. No file needed.
  This is what shows in the browser tab next to the site title and stops
  the /favicon.ico 404 errors in the console.
-->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%E2%9C%88%EF%B8%8F</text></svg>">

<!--
  =============================================================================
  INSTALLABLE APP (PWA)
  =============================================================================
  These four lines are what let the site be added to a phone's home screen as
  an app rather than a browser bookmark: its own icon, its own entry in the
  app switcher, and no browser address bar.

  Nothing about the site's appearance changes. It is the same HTML and CSS —
  the only difference is the window it opens in. Colours, fonts, maps,
  galleries and the status bar all behave exactly as they do now.

  There is deliberately NO service worker. That is what would add offline
  support, and it does it by caching pages on the device — which means a post
  published today can keep showing yesterday's version until the cache is
  invalidated. For a site that changes most days, silently stale content is a
  worse problem than needing a connection.

  theme-color tints the phone's own status bar to match the site header.
  =============================================================================
-->
<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
<meta name="theme-color" content="#1f4858">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Travels">
<link rel="apple-touch-icon"
      href="https://res.cloudinary.com/dgw35sldo/image/upload/c_fill,g_auto,w_180,h_180,f_png,q_auto/v1783872572/20210615_145029_sobd0b.png">

<!--
  GLightbox — click any photo (gallery or inline) to open a fullscreen viewer
  with prev/next arrows, ESC-to-close, and click-background-to-close. Free,
  vanilla JS, no jQuery.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
<script>
  // -------------------------------------------------------------------------
  // FIX MINIMAL MISTAKES' VIDEO WRAPPER
  // -------------------------------------------------------------------------
  // MM auto-wraps every YouTube/Vimeo iframe in a .fluid-width-video-wrapper
  // div using inline `style="padding-top: <ratio>%"`. When the iframe has
  // `width="100%" height="400"` attributes, the calculated ratio is 400%,
  // making the wrapper 4× too tall. Even with !important CSS rules, MM's
  // inline styles can occasionally win the specificity race.
  //
  // This snippet runs after the page loads and force-rewrites the inline
  // styles on every video wrapper to a clean 16:9 aspect ratio. JS-set
  // inline styles always win over JS-set inline styles (last-write).
  // -------------------------------------------------------------------------
  window.addEventListener("load", function () {
    document.querySelectorAll(".fluid-width-video-wrapper").forEach(function (w) {
      w.style.paddingTop = "0";
      w.style.paddingBottom = "0";
      w.style.height = "auto";
      w.style.aspectRatio = "16 / 9";
    });
  });
</script>

<script defer>
  // External links in post body should open in a new tab so readers don't
  // lose their place. Skip in-page anchors, gallery photo links (GLightbox
  // owns those), and any link on the same host (internal navigation stays
  // in the same tab so the back button works as expected).
  window.addEventListener("DOMContentLoaded", function () {
    var siteHost = window.location.hostname;
    document.querySelectorAll(".page__content a[href]").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      if (href.charAt(0) === "#") return;
      if (a.classList.contains("inline-gallery-link")) return;
      if (a.classList.contains("image-popup")) return;
      if (a.closest("figure")) return;
      if (!/^https?:\/\//i.test(href)) return;
      try {
        var url = new URL(href);
        if (url.hostname && url.hostname !== siteHost) {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
        }
      } catch (e) { /* malformed URL — leave alone */ }
    });
  });
</script>

<script defer>
  // Initialize after DOM and GLightbox library are both loaded.
  window.addEventListener("DOMContentLoaded", function () {
    if (typeof GLightbox === "undefined") return;

    // ---------------------------------------------------------------------
    // One lightbox, one group per cluster of photos.
    // ---------------------------------------------------------------------
    // Every link we want in the viewer gets BOTH:
    //   data-glightbox="type: image"  — skip GLightbox's extension sniffing,
    //     which otherwise falls back to iframe mode for Cloudinary URLs that
    //     don't end in .jpg and loads them at native size with scrollbars.
    //   data-gallery="<group>"        — decides what you can arrow between.
    //
    // Grouping rules:
    //   - inline gallery block  -> all its photos share the block's id
    //     (assigned by _plugins/gallery_block.rb)
    //   - <figure>              -> that figure's photos
    //   - anything else         -> its OWN unique group, so a standalone
    //     photo opens alone instead of dragging the whole post in with it
    //
    // That last rule is what fixes the Blogger-imported posts: those wrap
    // each photo in a bare <a> with no class or attribute, so previously
    // they either weren't picked up at all or fell into one giant unnamed
    // group spanning the entire page.
    var CONTENT = ".page__content";

    function isImageHref(href) {
      if (!href) return false;
      if (/\.(jpe?g|png|gif|webp|avif|bmp|svg)(\?|#|$)/i.test(href)) return true;
      // Cloudinary/Blogger delivery URLs often carry no extension.
      return /res\.cloudinary\.com|blogger\.googleusercontent\.com/.test(href);
    }

    var links = [];
    document.querySelectorAll(CONTENT + " a").forEach(function (a) {
      // Only links that actually wrap an image and point at an image.
      if (!a.querySelector("img")) return;
      if (!isImageHref(a.getAttribute("href"))) return;
      links.push(a);
    });

    var autoGroup = 0;
    links.forEach(function (a) {
      if (!a.dataset.glightbox) a.dataset.glightbox = "type: image";
      if (a.dataset.gallery) return;               // plugin already grouped it

      var fig = a.closest("figure, .inline-gallery, .gallery");
      if (fig) {
        if (!fig.dataset.lbGroup) fig.dataset.lbGroup = "grp" + (autoGroup++);
        a.dataset.gallery = fig.dataset.lbGroup;
      } else {
        // Standalone photo — a group of exactly one.
        a.dataset.gallery = "solo" + (autoGroup++);
      }
      a.classList.add("js-lightbox");
    });

    // Mark the plugin-generated links too so one selector covers everything.
    links.forEach(function (a) { a.classList.add("js-lightbox"); });

    // ---------------------------------------------------------------------
    // Stand down the theme's own lightbox.
    // ---------------------------------------------------------------------
    // Minimal Mistakes bundles Magnific Popup in main.min.js and wires it up
    // itself:
    //
    //   $("a[href$='.jpg'], …").has("> img").addClass("image-popup"),
    //   $(".image-popup").magnificPopup({ gallery: { enabled: true } })
    //
    // Our Cloudinary URLs end in .jpg and every gallery tile is an <a> around
    // an <img>, so every one of them gets picked up. The result was two
    // lightboxes bound to the same click: ours (correctly scoped to the
    // block) and the theme's (one gallery spanning the whole page). Closing
    // the first revealed the second.
    //
    // Unbind Magnific's handler and drop the class so it can't re-attach.
    // Run it repeatedly because the theme binds on jQuery's ready event and
    // we can't rely on winning that race.
    function standDownThemeLightbox() {
      if (!window.jQuery) return;
      var $ = window.jQuery;
      var $items = $(CONTENT + " a.image-popup");
      if (!$items.length) return;
      $items.off("click.magnificPopup").removeClass("image-popup");
    }
    standDownThemeLightbox();
    window.addEventListener("load", standDownThemeLightbox);
    setTimeout(standDownThemeLightbox, 300);
    setTimeout(standDownThemeLightbox, 1200);

    // A single instance. Creating more than one over overlapping selectors is
    // what caused a second, ungrouped lightbox to appear after closing the
    // first — the same click was being handled twice.
    if (window.__travelLightbox) window.__travelLightbox.destroy();
    window.__travelLightbox = GLightbox({
      selector: ".js-lightbox",
      loop: true,
      touchNavigation: true,
      // Click the dimmed area to dismiss, rather than hunting for the X.
      closeOnOutsideClick: true,
      // Keep the photo fitted to the viewport instead of native-size
      // with scrollbars.
      zoomable: false,
      draggable: false
    });

    // Older GLightbox builds ignore closeOnOutsideClick, so back it up with
    // an explicit handler on the container: a click that isn't on the image
    // itself or the arrows closes the viewer.
    window.__travelLightbox.on("open", function () {
      var el = document.querySelector(".goverlay, .glightbox-container");
      if (!el || el.dataset.outsideBound) return;
      el.dataset.outsideBound = "1";
      el.addEventListener("click", function (ev) {
        if (ev.target.closest(".gslide-media, .gnext, .gprev, .gclose")) return;
        window.__travelLightbox.close();
      });
    });
  });
</script>

<!--
  Netlify Identity widget. Loaded on every page so that:
   1. When someone clicks the email-confirmation link from their invite, the
      page can detect the auth token in the URL and route them to /admin/.
   2. A "Login" link in the future could trigger the widget from anywhere.
  When no one is signed in, the widget is invisible.
-->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  // After confirming an invitation, Netlify Identity drops the user back on
  // the homepage with a token in the URL. This snippet catches that and
  // forwards them straight to the admin editor.
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
