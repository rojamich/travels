# =============================================================================
# JEKYLL SITE CONFIGURATION
# =============================================================================
# This file controls site-wide settings. When you change anything here,
# Netlify rebuilds the whole site (takes about 1 minute).
#
# After pushing changes to GitHub, give it a minute, then refresh the browser.
# =============================================================================


# -----------------------------------------------------------------------------
# SITE BASICS — the stuff that shows up in titles, search results, RSS feeds
# -----------------------------------------------------------------------------
title: "Our Travels"
subtitle: "Adventures around the world"
name: "Mike & Jen"                     # Read by some theme surfaces (the footer uses
                                       # `title` above, not this). Was left as the
                                       # "[Wife's Name]" placeholder until 2026-08-27.
description: "A blog of our trips, photos, and stories."
email: ""                              # Optional. Leave blank if you don't want it public.

# IMPORTANT: these two URLs control where the site lives.
# Site is hosted on Netlify at the root domain (no subfolder), so baseurl
# is empty and url is the netlify.app domain.
url: "https://where-in-the-world-are-mike-and-jen.netlify.app"
baseurl: ""

# GitHub repo info — used by some theme features (edit-this-page links, etc.)
repository: "rojamich/travels"


# -----------------------------------------------------------------------------
# THEME — Minimal Mistakes, loaded remotely (no local install needed)
# -----------------------------------------------------------------------------
# `remote_theme` tells the build to fetch the theme from a GitHub repo at
# build time. The jekyll-remote-theme plugin (loaded below) handles this.
remote_theme: "mmistakes/minimal-mistakes@4.26.2"

# Minimal Mistakes ships several skins (color schemes). Pick one, or comment
# out and customize fully later. Options: default, air, aqua, contrast, dark,
# dirt, mint, neon, plum, sunrise.
minimal_mistakes_skin: "air"


# -----------------------------------------------------------------------------
# MAP — which basemap the maps draw on
# -----------------------------------------------------------------------------
# The pins, routes and shading are ours. The map *underneath* them is tiles
# borrowed from someone else's server, and that is the part that can change
# without warning: CARTO used to serve theirs to anyone and in 2026 started
# stamping "API KEY REQUIRED" across every tile of an unkeyed request.
#
# So the provider is a setting rather than a line buried in maps.js. If the
# next one changes its terms, this is the only line that has to change.
#
#   provider: "esri"   Esri World Street Map. No key, no signup. Labels every
#                      place in English — Yerevan, not Երևան; Tokyo, not 東京 —
#                      which is why we are not on plain OpenStreetMap tiles.
#             "carto"  CARTO Voyager, what the maps used before. Needs a free
#                      key in `carto_key` below or the tiles come watermarked.
#             "osm"    Plain OpenStreetMap. No key, but every label is in the
#                      local language and script. Last resort.
#
# carto_key: only read when provider is "carto". Get one, free and instantly,
# at https://carto.com/basemaps/apikey/ — no CARTO account needed. It covers
# 5 million tiles a month, which this site will not come close to using.
# It is not a secret: it ships in the page like any other basemap key, which
# is what it is designed for. If provider is "carto" and this is blank, the
# maps quietly draw with Esri instead so the watermark never comes back.
map:
  provider: "carto"
  carto_key: "cb1_2adp_1_419221c4ee01df9bdecff008"        # <- paste the key from CARTO between these quotes


# -----------------------------------------------------------------------------
# PLUGINS — extra Jekyll features
# -----------------------------------------------------------------------------
# These must also be listed in the Gemfile.
plugins:
  - jekyll-include-cache       # Required by Minimal Mistakes for performance
  - jekyll-sitemap             # Auto-generates sitemap.xml for search engines
  - jekyll-feed                # Auto-generates RSS/Atom feed
  - jekyll-seo-tag             # Adds SEO meta tags automatically
  - jemoji                     # Lets you write :airplane: and get ✈️ in posts
  - jekyll-remote-theme        # Loads the Minimal Mistakes theme from GitHub


# -----------------------------------------------------------------------------
# COMMENTS — Cusdis (no signup required for visitors)
# -----------------------------------------------------------------------------
# Activation is a two-step process:
#   1. Sign up at https://cusdis.com (free), add your site.
#      They give you an "App ID" (looks like 8b3f...uuid).
#   2. Paste the App ID into `cusdis_app_id` below, commit + push.
#
# Until you fill in `cusdis_app_id`, comment sections won't render.
comments:
  provider: "custom"            # tells Minimal Mistakes to use _includes/comments-providers/custom.html

cusdis_app_id: "7db99976-0c56-4488-bbbc-70579203ed05"               # PASTE YOUR CUSDIS APP ID HERE (between the quotes)


# -----------------------------------------------------------------------------
# READING — how posts are loaded and shown
# -----------------------------------------------------------------------------
# Read all .md files inside _posts/ as blog posts (Jekyll default).
# `permalink` controls the URL pattern. We use category + title so URLs look
# like /iceland-2024/day-1-reykjavik/
permalink: /:categories/:title/

# NO PAGINATION. The home page is a hand-built landing page that lists trips
# itself and never touches `paginator`, so this was doing nothing useful — but
# jekyll-paginate still generated one page per ten posts (30 of them) and gave
# them all index.html's `permalink: /`, so all 30 tried to write to the same
# file. That is the other conflict in the build log, and why /page2/ was a 404
# the whole time. Removed along with the plugin.

# Use Markdown processor "kramdown" with GitHub-Flavored Markdown.
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false


# -----------------------------------------------------------------------------
# DEFAULTS — front matter values applied to every post unless overridden
# -----------------------------------------------------------------------------
# This saves typing the same fields on every post. Anything you write in a
# post's own front matter overrides these defaults.
defaults:
  # Defaults for everything in _posts/
  - scope:
      path: ""
      type: posts
    values:
      layout: post                   # Custom wrapper that adds breadcrumb above the body
      author_profile: false          # Hide the sidebar author box
      read_time: true                # Show estimated read time
      comments: true                 # Renders the Cusdis include if cusdis_app_id is set
      share: true                    # Show social share buttons
      related: true                  # Show "related posts" at the bottom
      show_date: true
      toc: false                     # Table of contents — turn on per post if needed
      classes: wide                  # Use wider content area (good for photos)

  # Defaults for pages in _pages/
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide

  # Defaults for trip files in _trips/. The custom `trip` layout renders the
  # cover, mini-map, and the day-by-day post list automatically.
  - scope:
      path: ""
      type: trips
    values:
      layout: trip
      author_profile: false
      classes: wide


# -----------------------------------------------------------------------------
# COLLECTIONS — Jekyll content types beyond just posts
# -----------------------------------------------------------------------------
# `trips` is the master list of trips. Each file in _trips/ is one trip
# (metadata in front matter, optional intro text in body). Replaces the old
# _data/trips.yml — done this way so Decap CMS can edit trips visually.
collections:
  # NOTE: there is deliberately no `pages` collection here. _pages is on the
  # `include:` list below, which is all Jekyll needs to build those files as
  # ordinary pages — each one carries its own `permalink:`. Declaring it as a
  # collection as well built every page TWICE, both copies writing to the same
  # file, which is what filled the build log with:
  #
  #     Conflict: The following destination is shared by multiple files.
  #      - _pages/about.md
  #      - /opt/build/repo/_pages/about.md
  #
  # Same content both times, so nothing was visibly wrong — just the same work
  # done twice and a warning nobody could act on.
  trips:
    output: true
    permalink: /:name/


# -----------------------------------------------------------------------------
# INCLUDE / EXCLUDE — files to ignore when building the site
# -----------------------------------------------------------------------------
include:
  - _pages
  - _trips
  # Netlify reads this at the site root. It starts with an underscore, so
  # Jekyll would skip it without this line and the cache rules would never
  # reach the deployed site.
  - _headers

exclude:
  - README.md
  - WORKFLOW.md
  - EDITING.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - node_modules
  - netlify.toml
  - "*.gemspec"
