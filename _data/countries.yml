# =============================================================================
# countries.yml — THE single source of truth for country reference data
# =============================================================================
# One record per country. Every country, not just the visited ones: the list
# below is the full ISO 3166-1 set.
#
# At build time _plugins/country_data.rb derives three lookup tables from it:
#
#     site.data.country_codes      name  -> ISO 3166-1 alpha-3   (map shading)
#     site.data.continents         name  -> continent            (continent count)
#     site.data.country_aliases    alias -> canonical name       (normalising)
#
# Those three used to be hand-maintained files. Keeping them in step was the
# job nobody remembered to do: Costa Rica had a continent but no ISO code, so
# it counted toward the Countries tile and vanished from the world map, and
# the two numbers on /stats/ disagreed for months. Deriving them from one
# record makes that class of drift impossible — a country cannot have a
# continent but no code, because both live on the same line.
#
# WHY EVERY COUNTRY, NOT JUST OURS
# The editor's country picker used to be its own hand-written list of 199
# names in admin/config.yml. It had drifted both ways: 123 countries could be
# picked that this file had never heard of — each one silently missing from
# the world map and the continent tally — while 20 that were here, Puerto Rico
# and Hong Kong among them, could not be picked at all.
#
# The picker is now generated from this file by scripts/sync_country_options.py,
# so the two cannot disagree. That only works if everywhere she might go is
# already here, which is why the list is complete rather than visited-only.
# Nothing is counted as visited by being listed here; visits come from trips.
#
# FIELDS
#   name       canonical spelling. This is what gets displayed, and what trip
#              front matter should ideally use.
#   code       ISO 3166-1 alpha-3. Must match the world GeoJSON feature ids in
#              assets/data/world-countries.geo.json, or the country won't shade
#              on the map. Some small territories have no shape in that file —
#              they still count, they just have nothing to fill in.
#   continent  one of: North America, South America, Europe, Asia, Africa,
#              Oceania, Antarctica.
#   aliases    every other spelling that might show up in a trip's location,
#              a countries[] entry, or _data/favorites.yml. Matched exactly
#              after trimming, so add each variant you actually type. The
#              official ISO name is already an alias wherever it differs from
#              the friendly one, so "Viet Nam" and "Czechia" both resolve.
#
# TO CORRECT A COUNTRY: edit the record here, then run
#     python scripts/sync_country_options.py
# to push the change into the editor's picker (CI does this automatically on
# push, so it is only needed if you want to see it locally).
# TO CHECK IT WORKED: /admin-stats/ lists any country that resolves to no
# record, and the build log warns about incomplete records.
# =============================================================================

