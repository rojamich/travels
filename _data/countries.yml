# =============================================================================
# countries.yml — THE single source of truth for country reference data
# =============================================================================
# One record per country. This is the ONLY file to edit when adding a country.
#
# At build time _plugins/country_data.rb derives three lookup tables from it:
#
#     site.data.country_codes      name  -> ISO 3166-1 alpha-3   (map shading)
#     site.data.continents         name  -> continent            (continent count)
#     site.data.country_aliases    alias -> canonical name       (normalising)
#
# Those three used to be hand-maintained files. Keeping them in step was the
# job nobody remembered to do: Costa Rica had a continent but no ISO code, so
# it counted toward the Countries tile and vanished from the world map, and
# the two numbers on /stats/ disagreed for months. Deriving them from one
# record makes that class of drift impossible — a country cannot have a
# continent but no code, because both live on the same line.
#
# FIELDS
#   name       canonical spelling. This is what gets displayed, and what trip
#              front matter should ideally use.
#   code       ISO 3166-1 alpha-3. Must match the world GeoJSON feature ids,
#              or the country won't shade on the map.
#   continent  one of: North America, South America, Europe, Asia, Africa,
#              Oceania, Antarctica.
#   aliases    every other spelling that might show up in a trip's location,
#              a countries[] entry, or _data/favorites.yml. Matched exactly
#              after trimming, so add each variant you actually type.
#
# TO ADD A COUNTRY: add one record here. Nothing else to touch.
# TO CHECK IT WORKED: /admin-stats/ lists any country that resolves to no
# record, and the build log warns about incomplete records.
# =============================================================================

