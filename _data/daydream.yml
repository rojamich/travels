    country: Morocco
    why: We're back in Africa — this time to explore the northern edge of the
      world's second-largest continent! We will wander the blue-washed streets
      of Chefchaouen, explore the legendary Hercules Cave, savor another round
      of sweet mint tea, and lose ourselves in the winding chaos of Moroccan
      markets.
    when: January '27 - February '27
  - cover_focal_x: 50
    cover_focal_y: 50
    country: Georgia
    when: February '27 - July '27
    why: We are back in Tbilisi — this time we even have long enough to get in a
      rhythm. Gym, good food, and discovering Georgia's other seasons ❄️🌼☀️!
  - cover_focal_x: 50
    cover_focal_y: 50
    country: Tanzania
    why: The Great Migration! Fulfilling dreams to see Africa's wildest animals in
      their natural habitat and watch them cross country lines 🤯
    when: July '27
  - cover_focal_x: 50
    cover_focal_y: 50
    country: Kenya
    why: Continuing on our pursuit of the Great Migration! This trip will take us
      through border crossings on a grand adventure to see the wildest animals
