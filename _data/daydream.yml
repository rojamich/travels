    why: Our first trip to Turkey and we can't wait to explore Istanbul - The Blue
      Mosque, Hagia Sophia, Turkish Baths and the home of the döner 😃
    when: August/September '26
  - country: Argentina
    why: A second visit to South America to dip our toes into tango lessons, nature
