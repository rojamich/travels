# =============================================================================
# country_flags.yml — country name → national flag emoji
# =============================================================================
# Used by /stats/ to show a flag next to each country in the chip cloud.
# Keys must match the trailing-comma country name extracted from
# trip.location and trip.countries[].name — same as _data/continents.yml
# and _data/country_codes.yml. Missing lookups render the chip without
# a flag, no breakage.
#
# Flag emojis are two regional-indicator characters joined together
# (ISO 3166-1 alpha-2). Copy from any online reference if you add new
# countries; every UN member state has one.
# =============================================================================

