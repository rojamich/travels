# =============================================================================
# country_images.yml — optional flag/photo per country for the stats chips
# =============================================================================
# List of {name, url} entries. Managed from /admin/ → Site Settings →
# "Country flag images". When a country's name here matches a country
# on /stats/, the chip renders the image as a small 20×14 rounded
# rectangle to the left of the country name.
#
# To find a Wikipedia flag URL:
#   1. Search "Flag of Vietnam" on Wikipedia.
#   2. Click the flag image in the infobox at the top right.
#   3. On the file page, right-click the main image and Copy Image Link.
#   4. Paste it as the URL here.
#
# Any format works (SVG scales best; PNG/JPG fine). Missing or 404'd
# images just don't render — the chip falls back to plain name.
# =============================================================================

entries: []
