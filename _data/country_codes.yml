# =============================================================================
# country_codes.yml — country name → ISO 3166-1 alpha-3 code
# =============================================================================
# Used by /stats/ world coverage map to match our visited-country names
# against the GeoJSON feature ids (which are alpha-3 codes).
#
# Match must be EXACT to the trailing-comma country name we extract
# from trip.location and trip.countries[].name. Missing codes just
# don't get shaded on the map — they still count in the country tally.
# =============================================================================

