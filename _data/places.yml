# =============================================================================
# places.yml — remembered coordinates for places we have already pinned
# =============================================================================
# A place name typed once keeps its coordinates. When a trip or a post names
# a place in this file but leaves lat/lng blank, _plugins/places.rb fills
# them in at build time. Nothing has to be looked up twice.
#
# It is a CACHE, not the truth. Coordinates written directly on a trip or a
# post always win — this only fills gaps. So an entry here can never silently
# move a pin that was set by hand.
#
# HOW ENTRIES GET HERE
#   Seeded from every place already pinned on the site. To add one, either
#   pin it once on a trip/post as usual, or add a line here directly.
#
# WHAT IS DELIBERATELY MISSING
#   Names that were used for genuinely different spots are left out, because
#   guessing between them would put a pin in the wrong country:
#     - Peru
#     - United States of America
#   And "United Kingdom", which was pinned at Paris on European Excursion
#   — caching that would hand the wrong country to the next UK trip.
#
#   Those still need coordinates typed on the trip or post itself.
#
# CHECKING IT
#   /admin-stats/ lists any place named without coordinates that this file
#   does not know, and flags a pin that has drifted more than 25km from the
#   remembered position for the same name.
# =============================================================================

