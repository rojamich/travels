# =============================================================================
# tags.yml — the canonical list of tags
# =============================================================================
# Every tag that may be used on a trip or a post. The editor reads this list
# and offers it as a dropdown, so a tag can be PICKED rather than typed and
# there is no way to produce a near-miss by accident.
#
# It exists because free-text tagging drifted badly: the site had "Food" and
# "food", "Roadtrip" and "Road-trip", "South Africa" and "SouthAfrica",
# "Museum" and "Museums" — each pair splitting one filter into two, each
# looking correct in the editor. Ten such pairs were merged when this file
# was created.
#
# TO ADD A TAG
#   /admin/ -> Site Settings -> Tags -> Add, then pick it on the post. New
#   tags are meant to be added here first; that is the whole point.
#
# TO RENAME OR MERGE ONE
#   Changing a name here does NOT rewrite the posts already using the old
#   one. Update the posts too, or /admin-stats/ will list the tag as unknown.
#
# Alphabetical. The count in the comment is how many trips and posts used it
# when the list was generated — a rough guide to which are load-bearing.
# =============================================================================

