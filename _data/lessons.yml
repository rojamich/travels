intro: Here is a a running collection of our shifting views on places and life
  on the road. Mike & I started seriously traveling in 2022 and have experienced
  27 countries so far! We have learned and grown a lot along the way and I
  really don't want to forget some of life's lessons. So I'll be documenting
  those here 😊
entries:
  - topic: Example — Living out of a backpack
    example: true
    category: Life on the road
    before: We assumed we'd want a full closet after a month and be miserable
      rewearing the same three shirts.
    updates:
      - date: 2026-01-15
        thought: One month in and honestly, choosing an outfit takes 5 seconds. It's
          freeing.
      - date: 2026-04-02
        thought: Started missing our nice clothes once we hit a wedding. Might upgrade
          one 'nice outfit' per person.
    current: Less stuff, more freedom — but keep one dressy outfit each. The daily
      decision-fatigue reduction is a real quality-of-life win we didn't expect.
    status: evolved
  - topic: Example — Vietnam
    example: true
    category: Country
    before: Expected it to feel intimidating — traffic chaos, language barrier, food
      we couldn't identify.
    updates:
      - date: 2025-12-14
        thought: The traffic looks insane but there's a rhythm. Just walk slow and
          steady, don't stop.
      - date: 2025-12-22
        thought: Falling in love with pho for breakfast. Vietnamese coffee is the best
          coffee we've had anywhere.
    current: One of the most welcoming places we've been. We'd return in a heartbeat
      and go slower next time.
    status: loved
  - example: false
    status: evolved
    topic: Friendliness Looks Different Everywhere
    category: Relationships
    current: >-
      People can be friendly and kind without smiling a ton and cheerfully
      exclaiming welcomes. This was a hard lesson for me as most countries are
      very much friendly. 


      Peru, Germany, and Georgia are prime examples. It was blatantly obvious to me the other day here that I was being helped by a kind-hearted individual despite no smile or words. Mike and I stood before this massive church while service went on inside. We hesitated outside the door and it looked really full. I had worn pants to avoid being offensive but a skirt and head-covering were required. An elderly man quietly (with what appeared to be a scowl on his face) watched our exchange.


      Just when we were about to turn back, I hear him utter a few Georgian words and he extends his hand with a wrap  towards me. I quickly tie it around myself as he tosses a headscarf on my head 🤣

      Is that how I would have executed it? Probably not. But his kindness is still lingering, days later. This was an important lesson for me as we continue to see new worlds.
  - example: false
    status: in_progress
    topic: New Foods
    category: Food
    before: >-
      When I met Mike, I had no desire to leave my hometown, much less travel
      the world. He responded that one day he wanted to travel to Africa! But...
      But... my comfort zones! My foods! Nothing could possibly be better than
      what I have here... could it?

      You may have grown up in the land of delicious produce but the best cantaloupe of your life might still be ahead.
    current: >-
      I will still probably be chasing the high of this cantaloupe for years to
      come! While I have grown so much since the first step outside our door, I
      still have much growing to do. Each time I get comfortable or want to
      resort to the easiest route, I stop and ask myself, what am I gaining from
      staying comfortable?

      After all, comfortable could've missed me the best cantaloupe of my life...
  - example: false
    status: pivoted
    topic: Don't Leave America!
    before: Before we left the US for our first trip, I was scared. We were only
      going to Europe but we've all seen the news! Travel abroad is lethal! Pick
      pockets, scam artists, armed robberies, kidnapping, human trafficking,
      beheading. You name it, it's overseas.
    current: >-
      Why is this entry labeled as pivoted and not evolved? Because, to be
      honest, I still get scared. No matter how many times I'm proven wrong, I'm
      scared, nervous, anxious in some places. Sometimes, its because its just
      new. New culture, language, foods. Other times its ignorance, the media,
      and stereotypes that I have to unlearn.


      The ironic part is that people who never leave their country will be the ones telling you other countries are unsafe. 


      {% gallery_block %7B%22photos%22%3A%5B%22https%3A%2F%2Fres.cloudinary.com%2Fdgw35sldo%2Fimage%2Fupload%2Fc_limit%2Cf_auto%2Cq_auto%2Cw_1200%2Fv1785830763%2F20250909_143228_nlvh2z.jpg%22%2C%22https%3A%2F%2Fres.cloudinary.com%2Fdgw35sldo%2Fimage%2Fupload%2Fc_limit%2Cf_auto%2Cq_auto%2Cw_1200%2Fv1785830846%2F20240830_123559_mnsxpo.jpg%22%2C%22https%3A%2F%2Fres.cloudinary.com%2Fdgw35sldo%2Fimage%2Fupload%2Fc_limit%2Cf_auto%2Cq_auto%2Cw_1200%2Fv1785718075%2Fblogger-import%2F6b6c4ae948d742acb770.jpg%22%5D%2C%22caption%22%3A%22Us%20%5C%22surviving%5C%22%20in%20Peru%2C%20South%20Africa%2C%20and%20Vietnam%20%F0%9F%8C%B4%F0%9F%97%BB%F0%9F%8F%8D%EF%B8%8F%22%7D %}


      I cannot tell you the number of people who have warned us against countries - everything from Greece to South Africa was too dangerous to explore. Are there dangerous places out there? Absolutely. That's why we do research, take precautions, and are very careful. We are still susceptible to harm of course. But that's no reason to lock yourself away at home. In fact, the only time Mike and I were in serious, life-threatening danger, was in the US when a man chased us with a knife in a San Diego park.


      Speaking of home, the US doesn't typically rank higher than #50 in the safest countries lists.


      [Source 1](https://www.usnews.com/news/best-countries/rankings/public-safety) 


      [Source 2](https://gfmag.com/data/safest-countries-world/)


      [Source 3](https://www.visionofhumanity.org/maps/#/)
