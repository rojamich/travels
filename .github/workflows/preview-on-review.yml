# =============================================================================
# Build a post's preview when it moves to In Review (or Ready)
# =============================================================================
# Previews of drafts are skipped (scripts/preview_gate.py, run by Netlify
# before every build). The preview is wanted once she moves the card to In
# Review — but moving a card only changes the pull request's label. Nothing
# is pushed, so Netlify has no reason to build anything.
#
# This gives it one: an empty commit on the post's branch. Same files, so
# the post is untouched; it just puts a new commit in front of Netlify, and
# the gate, now seeing In Review, lets that build through.
#
# Skipped when the branch's latest commit already has a preview built or
# building — moving a reviewed card on to Ready needs no second copy.
#
# "Built" means a real preview, not a skipped one. Netlify reports a draft's
# canceled build as state "success" too ("Deploy Preview canceled."), so the
# state alone can't tell them apart; the link can. A real preview links to
# its own deploy-preview-N--… address, a canceled one to Netlify's dashboard.
#
# A commit pushed with GITHUB_TOKEN doesn't start other workflows, so this
# can't set itself off again.
# =============================================================================
name: Preview on review

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  statuses: read

jobs:
  nudge-netlify:
    if: >-
      startsWith(github.event.pull_request.head.ref, 'cms/') &&
      (github.event.label.name == 'decap-cms/pending_review' ||
       github.event.label.name == 'decap-cms/pending_publish')
    runs-on: ubuntu-latest
    steps:
      - name: Push an empty commit so Netlify builds the preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          # Each part escaped on its own: the slashes stay slashes, an emoji
          # in a post's name does not break the URL.
          ref=$(jq -rn --arg b "$BRANCH" '$b | split("/") | map(@uri) | join("/")')

          head=$(gh api "repos/$REPO/git/ref/heads/$ref" --jq '.object.sha')
          preview=$(gh api "repos/$REPO/commits/$head/status" \
            --jq '[.statuses[] | select(.context | endswith("/deploy-preview"))
                   | if .state == "success" and ((.target_url // "") | test("//deploy-preview-") | not)
                     then "canceled" else .state end] | first // ""')
          if [ "$preview" = "success" ] || [ "$preview" = "pending" ]; then
            echo "$BRANCH already has a preview ($preview) for $head — nothing to do."
            exit 0
          fi

          tree=$(gh api "repos/$REPO/git/commits/$head" --jq '.tree.sha')
          case "$LABEL" in
            *pending_review)  status="In Review" ;;
            *)                status="Ready" ;;
          esac
          commit=$(gh api "repos/$REPO/git/commits" \
            -f message="Build the preview: moved to $status" \
            -f tree="$tree" -f "parents[]=$head" --jq '.sha')

          # Not forced: if she saved in the last few seconds, her save is
          # newer than this and already started a build of its own.
          gh api -X PATCH "repos/$REPO/git/refs/heads/$ref" -f sha="$commit" \
            && echo "Pushed $commit to $BRANCH — Netlify will build its preview." \
            || echo "$BRANCH moved on while this ran; her newer save builds instead."
