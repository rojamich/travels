# =============================================================================
# Sync trip filters
# =============================================================================
# The editor's "quick filter" buttons (the trip names down the side of the
# Posts list) have to be listed out in admin/config.yml — Decap CMS can't
# work them out for itself. This job keeps that list honest: whenever a trip
# is added, renamed or unpublished on main, it re-runs the generator and
# commits the result, so nobody has to remember to do it.
#
# It only ever rewrites the block between the BEGIN/END markers in
# admin/config.yml, and it refuses to commit anything that isn't valid YAML.
# =============================================================================
name: Sync trip filters

on:
  push:
    branches: [main]
    paths: ['_trips/**']
  # Lets you run it by hand from the Actions tab if you ever need to.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - run: python scripts/sync_trip_filters.py

      - name: Commit the refreshed list (only if it changed)
        run: |
          if git diff --quiet -- admin/config.yml; then
            echo "Filter list already matched _trips — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/config.yml
          git commit -m "Editor: refresh the trip filter list"
          git push
