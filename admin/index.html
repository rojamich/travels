      //               startsWith so trailing required markers don't break it).
      //   focalXLabel / focalYLabel: labels of the two number inputs to write.
      //   box: { w, h } pixel size of the preview box in the modal — choose
      //        an aspect ratio that matches how the photo is used on the site.
      var FIELDS = [
        // "Cover photo" appears on Trips, Favorites entries and Daydream
        // entries — all with the same focal label pair — so this single
        // config covers all three. groupedTargets() splits repeating list
        // rows into one tab each, and resolveCoverBox() picks the preview
        // size that matches whichever collection is actually open.
        { key: "cover",   tab: "Cover",            labelMatch: "Cover photo",
          focalXLabel: "Cover — focal X (0–100)",
          focalYLabel: "Cover — focal Y (0–100)",
          box: null,   // resolved per-collection at open time
          desc: null },
        // The teaser is shown at TWO quite different shapes, so it gets a
        // second preview. 10:7 on the trip page, but roughly 2.3:1 in the
        // "On this day" cards on the home page, which crops away far more
        // top and bottom. One focal point has to serve both, and without
        // seeing the wide one it is easy to set a position that looks right
        // on the trip page and cuts someone's head off at home.
        { key: "teaser",  tab: "Post teaser",      labelMatch: "Teaser (small thumbnail in listings)",
          focalXLabel: "Teaser — focal X (0–100)",
          focalYLabel: "Teaser — focal Y (0–100)",
          box: { w: 400, h: 280 },
          also: { w: 400, h: 172, label: "On this day (home page)" },
          desc: "Two places use this photo, both shown below. Drag either one — they move together." },
        { key: "overlay", tab: "Post banner",      labelMatch: "Banner (large image at top of post)",
          focalXLabel: "Banner — focal X (0–100)",
          focalYLabel: "Banner — focal Y (0–100)",
          box: { w: 480, h: 160 },
          desc: "The wide banner at the top of the post page (3:1)." },
        // Photos inside a 📷 Photo Gallery block. These live in the editor
        // component's own modal rather than on the entry form, but
        // groupedTargets() scans the whole document, so they're found as soon
        // as that modal is open — and because the gallery is a list, each
        // photo becomes its own tab.
        //
        // Works anywhere a gallery block is used: travel posts, Lessons
        // entries, anywhere else the editor component is available.
        //
        // Tiles are square (aspect-ratio 1/1 in main.scss), which is exactly
        // why wide photos lose their top and bottom — so the preview is
        // square too.
        { key: "gallery", tab: "Gallery photo",    labelMatch: "Image",
          focalXLabel: "Focal X (0–100)",
          focalYLabel: "Focal Y (0–100)",
          box: { w: 240, h: 240 },
          desc: "A photo inside a gallery block. Tiles are square, so wide shots get cropped top and bottom — drag to choose what stays." }
      ];

      // ----- Preview box sizing -----
      // object-position percentages resolve differently at different aspect
      // ratios, so the preview box MUST match the real card's shape or the
      // saved position won't reproduce what she saw while dragging.
      //
      // "Cover photo" is shared by three collections whose cards are all
      // different shapes, and the label alone can't tell them apart — so we
      // read the open collection out of Decap's hash route instead.
      //
      // Sizes below mirror the live CSS:
      //   Trip card   grid minmax(300px,1fr) x 200px tall   (index.html)
      //   Favorites   grid minmax(240px,1fr) x 140px tall   (main.scss)
      //   Daydream    flex 0 0 180px wide, row-height tall  (main.scss)
      function resolveCoverBox() {
        var h = location.hash || "";
        if (h.indexOf("favorites") !== -1) {
          // Measured in-browser: card image renders 264x140 at a typical
          // desktop width (grid auto-fill minmax(240px,1fr)).
          return { w: 264, h: 140,
                   desc: "Shows as the card image on the Favorites page." };
        }
        if (h.indexOf("daydream") !== -1) {
          return { w: 180, h: 140,
                   desc: "Shows as the thumbnail on the Daydreaming page." };
        }
        // Measured in-browser: homepage trip card image renders ~400x200.
        return { w: 400, h: 200,
                 desc: "Shows as the trip card on the homepage. Card width flexes with screen size, so this is very close but not pixel-exact." };
      }

      function escapeHtmlAttr(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      // ----- DOM scraping helpers -----
      // Walk all <label>s in the form; match by startsWith so we tolerate the
      // little extras Decap may append (asterisks, hints, colons).
      function eachLabel(text, fn) {
        var labels = document.querySelectorAll("label, span[class*='label']");
        for (var i = 0; i < labels.length; i++) {
          var t = (labels[i].textContent || "").trim();
          if (t === text || t.indexOf(text) === 0) {
            if (fn(labels[i]) === false) return;
          }
        }
      }
      function findFieldContainer(labelText) {
        var found = null;
        eachLabel(labelText, function (lbl) {
          var parent = lbl.parentElement;
          for (var d = 0; d < 5 && parent; d++) {
            if (parent.querySelector("input, textarea, img")) { found = parent; return false; }
            parent = parent.parentElement;
          }
        });
        return found;
      }
      function readImageUrl(container) {
        if (!container) return "";
        // The image widget renders a preview <img> whose src is the current URL.
        var img = container.querySelector("img");
        if (img && img.src && img.src.indexOf("data:") !== 0) return img.src;
        var input = container.querySelector("input[type='text'], input[type='url']");
        return input ? input.value : "";
      }
      function findNumberInput(labelText) {
        var found = null;
        eachLabel(labelText, function (lbl) {
          var parent = lbl.parentElement;
          for (var d = 0; d < 5 && parent; d++) {
            var input = parent.querySelector("input[type='number']");
            if (input) { found = input; return false; }
            parent = parent.parentElement;
          }
        });
        return found;
      }

      // ----- Repeating-list support -----
      // Favorites categories and Daydream entries are Decap LIST widgets, so
      // a single form can contain many "Cover photo" fields — one per entry.
      // findFieldContainer() only ever returns the first, which would let her
      // position entry #1 and nothing else.
      //
      // groupedTargets() instead collects EVERY label matching imageLabel,
      // then walks up from each to the nearest ancestor that also contains
      // the matching focal X/Y number inputs. That ancestor is the list
      // item, so each entry gets its own independent target. Falls back to
      // the whole document for non-repeating fields (trip cover, post
      // teaser/banner) where there's only one of each.
      function groupedTargets(imageLabel, focalXLabel, focalYLabel) {
        var out = [];
        var labels = document.querySelectorAll("label, span[class*='label']");
        for (var i = 0; i < labels.length; i++) {
          var t = (labels[i].textContent || "").trim();
          if (t !== imageLabel && t.indexOf(imageLabel) !== 0) continue;

          // Read the image from the label's OWN field wrapper before widening
          // the search for the focal inputs.
          //
          // Post banners were showing the teaser photo because of this: the
          // scope that contains "Banner — focal X/Y" also contains the Teaser
          // image field, and querySelector("img") returns the first match in
          // document order — the teaser. So changing the banner appeared to
          // do nothing, since the tool was previewing a different field's
          // photo the whole time.
          var ownUrl = readImageUrlNearLabel(labels[i]);

          // Now walk up looking for a scope that holds this field's focal pair.
          var node = labels[i].parentElement;
          for (var d = 0; d < 12 && node; d++) {
            var fx = findNumberInputWithin(node, focalXLabel);
            var fy = findNumberInputWithin(node, focalYLabel);
            if (fx && fy) {
              out.push({
                container: node,
                url: ownUrl,
                fxInput: fx,
                fyInput: fy,
                // Best-effort label for the tab: the entry's own name field
                // (Country / Place) so tabs read "Vietnam" not "Entry 3".
                name: readEntryName(node)
              });
              break;
            }
            node = node.parentElement;
          }
        }
        return out;
      }
      // Resolve the image belonging to THIS label specifically.
      //
      // Walks up one ancestor at a time and returns as soon as it finds an
      // <img>. The nearest ancestor holding an image is that field's own
      // widget wrapper, so a label like "Banner (large image at top of post)"
      // can never pick up a neighbouring field's photo (e.g. the teaser)
      // the way a wider group-level search would.
      //
      // Falls back to the widget's URL text input when no image is set yet.
      function readImageUrlNearLabel(label) {
        var node = label.parentElement;
        for (var d = 0; d < 8 && node; d++) {
          var img = node.querySelector("img");
          if (img && img.src && img.src.indexOf("data:") !== 0) return img.src;
          var input = node.querySelector("input[type='text'], input[type='url']");
          if (input && input.value && /^https?:\/\//i.test(input.value)) return input.value;
          node = node.parentElement;
        }
        return "";
      }

      // Finds the focal input that belongs to a given label.
      //
      // Accepts text inputs as well as number ones: the gallery's focal fields
      // are string widgets (see the gallery editor component for why), which
      // Decap renders as <input type="text">. Cover/teaser/banner are still
      // number widgets. Matching both keeps one code path for all four.
      function findNumberInputWithin(scope, labelText) {
        var labels = scope.querySelectorAll("label, span[class*='label']");
        for (var i = 0; i < labels.length; i++) {
          var t = (labels[i].textContent || "").trim();
          if (t !== labelText && t.indexOf(labelText) !== 0) continue;
          var parent = labels[i].parentElement;
          for (var d = 0; d < 5 && parent; d++) {
            var input = parent.querySelector(
              "input[type='number'], input[type='text'], input:not([type])");
            if (input) return input;
            parent = parent.parentElement;
          }
        }
        return null;
      }
      // Pull a human name out of a list-entry scope so tabs are readable.
      // Looks for the first text input whose label starts with a known
      // naming field ("Country / Place", "Category name", "Title").
      function readEntryName(scope) {
        var NAME_LABELS = ["Country / Place", "Category name", "Title", "Trip name", "Place name"];
        var labels = scope.querySelectorAll("label, span[class*='label']");
        for (var i = 0; i < labels.length; i++) {
          var t = (labels[i].textContent || "").trim();
          for (var n = 0; n < NAME_LABELS.length; n++) {
            if (t.indexOf(NAME_LABELS[n]) !== 0) continue;
            var parent = labels[i].parentElement;
            for (var d = 0; d < 5 && parent; d++) {
              var input = parent.querySelector("input[type='text']");
              if (input && input.value) return input.value;
              parent = parent.parentElement;
            }
          }
        }
        return "";
      }
      // React-controlled inputs ignore plain `input.value = x`. React replaces
      // the `value` property ON THE INSTANCE with a tracked setter, so we call
      // the PROTOTYPE's native setter to get underneath it, then dispatch the
      // events React listens for.
      //
      // The extra `_valueTracker` reset matters for the gallery: those focal
      // inputs live inside Decap's editor-component modal, a separate React
      // form from the main entry. If the tracker still holds the value we're
      // writing, React treats the change as a no-op and the modal never goes
      // dirty — which is exactly the "Save positions does nothing" symptom.
      // Clearing the tracker first forces the change to be seen.
      //
      // Returns true only if the value actually landed, so the caller can tell
      // the difference between "saved" and "silently did nothing".
      function setReactValue(input, value) {
        if (!input) return false;
        var str = String(value);
        try {
          if (input._valueTracker && typeof input._valueTracker.setValue === "function") {

          }
        } catch (e) { /* tracker is a React internal; absence is fine */ }

        var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
        setter.call(input, str);
        input.dispatchEvent(new Event("input",  { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
        // Some Decap widgets only commit on blur rather than on every keystroke.
        input.dispatchEvent(new Event("blur",   { bubbles: true }));

        return input.value === str;
      }
      function readFocalValue(input, fallback) {
        if (!input) return fallback;
        var v = parseFloat(input.value);
        if (isNaN(v) || v < 0 || v > 100) return fallback;
        return v;
      }

      // ----- Drag mechanics -----
      // Single shared drag state across the whole positioner. Global mouse /
      // touch listeners are attached ONCE at module init (not per bindDrag
      // call) so repeatedly opening the modal or switching tabs doesn't stack
      // duplicate listeners on document. Each bindDrag call just swaps the
      // currentDrag pointer; an inactive currentDrag is a no-op for the
      // global handlers.
      var currentDrag = null;
      function clamp01(v) { return Math.max(0, Math.min(100, v)); }

        if (!currentDrag || !currentDrag.dragging) return;

        var dx = clientX - d.sx, dy = clientY - d.sy;
        d.state.x = d.overflowX > 0 ? clamp01(d.sfx - (dx / d.overflowX) * 100) : d.sfx;
        d.state.y = d.overflowY > 0 ? clamp01(d.sfy - (dy / d.overflowY) * 100) : d.sfy;
        d.render();
      }
      function doEnd() {
        if (!currentDrag || !currentDrag.dragging) return;
        currentDrag.dragging = false;
        document.body.style.userSelect = "";
        if (currentDrag.box) currentDrag.box.style.cursor = "grab";

      document.addEventListener("mousemove", function (e) { doMove(e.clientX, e.clientY); });
      document.addEventListener("mouseup",   doEnd);
      document.addEventListener("touchmove", function (e) {
        if (!currentDrag || !currentDrag.dragging || !e.touches[0]) return;
        doMove(e.touches[0].clientX, e.touches[0].clientY);

      function bindDrag(box, img, state, render) {
        // Identity token for THIS bind. Guards against a late-firing load
        // event from a previously-bound tab writing its own measurements
        // into the drag context that has since been replaced.
        //
        // Without this, switching tabs in a multi-entry form (Favorites has
        // one tab per entry) left a landmine: the old tab's image finishes
        // decoding after the switch, its load handler runs, and it clobbers
        // the CURRENT tab's overflow numbers with the old image's. The drag
        // math then divides by the wrong overflow, so the same physical drag
        // produced a wildly different percentage than the preview showed.
        var token = {};

        // Returns how many pixels of the image hang outside the box on each
        // axis under object-fit: cover. That overflow is the full travel
        // range 0%–100% maps onto.
        function measure() {
          var bw = box.clientWidth, bh = box.clientHeight;
          var iw = img.naturalWidth, ih = img.naturalHeight;
          if (!iw || !ih || !bw || !bh) return null;
          var imgAR = iw / ih, boxAR = bw / bh;
          var rW, rH;
          if (imgAR > boxAR) { rH = bh; rW = bh * imgAR; }
          else                { rW = bw; rH = bw / imgAR; }
          return { x: Math.max(0, rW - bw), y: Math.max(0, rH - bh) };
        }

        // Replace whatever was the active drag context with this new one.
        currentDrag = {
          token: token,
          box: box, img: img, state: state, render: render,
          dragging: false, sx: 0, sy: 0, sfx: 50, sfy: 50,
          overflowX: 0, overflowY: 0
        };

        function applyMeasure() {
          if (!currentDrag || currentDrag.token !== token) return;
          var m = measure();
          if (!m) return;
          currentDrag.overflowX = m.x;
          currentDrag.overflowY = m.y;
        }

        // The <img> was just written via innerHTML, so img.complete is
        // almost always false here — measure now if we can, and again on
        // load, and once more at grab time (below) which is the one that
        // actually matters.
        applyMeasure();
        img.addEventListener("load", function () { applyMeasure(); render(); });

        function start(clientX, clientY) {
          if (!currentDrag || currentDrag.token !== token) return;
          // Re-measure at grab time. By now the image is decoded and the box
          // has its final layout size, so these numbers are the real ones —
          // no dependence on whether a load event fired in time.
          applyMeasure();
          currentDrag.dragging = true;
          currentDrag.sx = clientX; currentDrag.sy = clientY;
          currentDrag.sfx = state.x; currentDrag.sfy = state.y;
          document.body.style.userSelect = "none";
          box.style.cursor = "grabbing";
        }

        box.addEventListener("mousedown", function (e) { e.preventDefault(); start(e.clientX, e.clientY); });
        box.addEventListener("touchstart", function (e) {
          if (!e.touches[0]) return;
          e.preventDefault();
          start(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
      }

        document.head.appendChild(style);

          "  <div class='modal-body'></div>" +

      function openModal() {
        buildModal();

        // changed in the modal but hasn't yet saved back to the form.
        // Expand each configured field into one entry PER occurrence on the
        // form. Single fields (trip cover, post teaser/banner) yield one;
        // list fields (Favorites entries, Daydream entries) yield one per
        // row, each wired to that row's own focal inputs.
        var available = [];
        FIELDS.forEach(function (f) {
          var targets = groupedTargets(f.labelMatch, f.focalXLabel, f.focalYLabel);
          // Cover ships with box/desc null — resolve them against whichever
          // collection is currently open so the preview matches that card.
          var cfg = f;

              key: f.key, tab: f.tab, labelMatch: f.labelMatch,

              var vy = modalBody.querySelector(".vy");

            paint();
            stages.forEach(function (s) {
              var i = s.querySelector("img");
              if (!i) return;
              bindDrag(s, i, entry.pending, paint);
              s.style.cursor = "grab";
            });
          }
        }

        render();
        modal.classList.add("open");
      }
      function closeModal() {
        if (modal) modal.classList.remove("open");

            position: cs.position, zIndex: cs.zIndex, background: cs.backgroundColor
          }));
          console.log("[photo-pos] parent:", el.parentElement && el.parentElement.tagName,
                      "isConnected:", el.isConnected);
        }, 50);
      }

      console.log("[photo-pos] script ran; document.readyState =", document.readyState);
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", buildButton);
      } else {
        buildButton();
      }
      // Defensive retry in case Decap remounts the body later and removes the button.
      setTimeout(buildButton, 2000);
      setTimeout(buildButton, 5000);
    })();
    } catch (err) {
      console.error("[admin] Photo Positioner init failed:", err);
    }

    // ----- "🎬 YouTube Video" -----
    CMS.registerEditorComponent({
      id: "youtube",
      label: "🎬 YouTube Video",
      fields: [
        {
          name: "url",
          label: "YouTube URL",
          widget: "string",
          hint: "Paste the YouTube URL from your browser. Any format works (youtube.com/watch?v=..., youtu.be/..., or just the video ID)."
        }
      ],
      pattern: /\{%\s*youtube_block\s+(\S+)\s*%\}/,
      fromBlock: function (match) {
        try { return JSON.parse(decodeURIComponent(match[1])); }
        catch (e) { return { url: "" }; }
      },
      toBlock: function (data) {
        return "{% youtube_block " + encodeURIComponent(JSON.stringify(data)) + " %}";
      },
      toPreview: function (data) {
        var url = (data && data.url) || "";
        // Try to extract the ID so we can show a thumbnail preview
        var m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([\w-]{11})|^([\w-]{11})$/);
        var id = m && (m[1] || m[2]);
        if (id) {
          return '<div style="border:1px dashed #aaa;padding:0.6em;background:#fafafa;border-radius:6px;">' +
                 '<div style="font-size:0.85em;color:#555;margin-bottom:0.3em;">🎬 YouTube preview</div>' +
                 '<img src="https://img.youtube.com/vi/' + id + '/hqdefault.jpg" style="width:100%;max-width:480px;display:block;">' +
                 '</div>';
        }
        return '<div style="border:1px dashed #aaa;padding:0.6em;background:#fafafa;color:#888;">🎬 ' + (url || '(paste a YouTube URL)') + '</div>';
      }
    });

    // ----- "🎵 Audio Clip" -----
    CMS.registerEditorComponent({
      id: "audio",
      label: "🎵 Audio Clip",
      fields: [
        {
          name: "audio",
          label: "Audio file",
          widget: "file",
          hint: "Upload an MP3 (or any audio file Cloudinary accepts)."
        },
        {
          name: "title",
          label: "Title (optional)",
          widget: "string",
          required: false,
          hint: "Shown above the player. e.g. 'Sounds of the Hanoi market'."
        }
      ],
      pattern: /\{%\s*audio_block\s+(\S+)\s*%\}/,
      fromBlock: function (match) {
        try {
          return JSON.parse(decodeURIComponent(match[1]));
        } catch (e) {
          return { audio: "", title: "" };
        }
      },
      toBlock: function (data) {
        return "{% audio_block " + encodeURIComponent(JSON.stringify(data)) + " %}";
      },
      toPreview: function (data) {
        var title = (data && data.title) ? data.title : "(audio clip)";
        var url = (data && data.audio) || "";
        return (
          '<div style="border:1px dashed #aaa;padding:0.6em;background:#fafafa;border-radius:6px;">' +
          '<div style="font-size:0.85em;color:#555;">🎵 ' + title + '</div>' +
          (url ? '<audio controls preload="none" src="' + url + '" style="width:100%;margin-top:0.5em;"></audio>' : '<div style="color:#aaa;">(no audio uploaded yet)</div>') +
          "</div>"
        );
      }
    });

    // ----- "📷 Photo Gallery" -----
    CMS.registerEditorComponent({
      id: "gallery",
      label: "📷 Photo Gallery",
      fields: [
        {
          name: "photos",
          label: "Photos",
          widget: "list",
          summary: "{{fields.image}}",
          // Start a brand new gallery as an empty list rather than letting
          // Decap seed the field with "". Without this the console logs
          // "Expected List value to be an array but received ''" every time
          // she opens the gallery button on a fresh block.
          default: [],
          // A `fields` array rather than a single `field`, so each photo can
          // carry its own focal point alongside the URL. Tiles are a fixed
          // shape, so a photo whose aspect ratio differs gets cropped — these
          // decide which part survives, letting a wide shot keep its subject
          // without changing the tile size. Both default to 50 (centre),
          // which is exactly what galleries rendered before, so existing
          // ones are unaffected and need no re-saving.
          fields: [
            {
              name: "image",
              label: "Image",
              widget: "image",
              hint: "Click here, then upload or pick a photo. Repeat 'Add' to add more."
            },
            // These are STRING widgets, not number widgets, and deliberately so.
            //
            // Decap's `number` widget does not work inside a
            // registerEditorComponent modal when nested in a list's `fields`:
            // the input renders but is never wired to the form's onChange, so
            // it rejects typing and ignores programmatic writes alike. That is
            // why "Save positions" appeared to do nothing here while working
            // fine for cover/teaser/banner, which are ordinary entry fields.
            //
            // A string widget is plainly wired and behaves. The Ruby side
            // (clamp_pct in _plugins/gallery_block.rb) parses with Float() and
            // falls back to 50, so "50", 50 and junk all land safely — no
            // migration needed for galleries already saved with numbers.
            {
              name: "x",
              label: "Focal X (0–100)",
              widget: "string",
              required: false,
              default: "50",
              hint: "Only matters if the photo is being cropped in its tile. 50 = centred, 0 = keep the left edge, 100 = keep the right."
            },
            {
              name: "y",
              label: "Focal Y (0–100)",
              widget: "string",
              required: false,
              default: "50",
              hint: "0 = keep the top of the photo, 100 = keep the bottom. Useful for landscape shots where the subject sits high or low."
            }
          ],
          hint: "Add as many photos as you want — they'll render in a grid. Leave the focal numbers alone unless a photo is cropping badly."
        },
        {
          name: "caption",
          label: "Caption (optional)",
          widget: "string",
          required: false,
          hint: "Shown below the gallery in italic."
        }
      ],
      pattern: /\{%\s*gallery_block\s+(\S+)\s*%\}/,
      fromBlock: function (match) {
        try {
          return JSON.parse(decodeURIComponent(match[1]));
        } catch (e) {
          return { photos: [], caption: "" };
        }
      },
      toBlock: function (data) {
        return "{% gallery_block " + encodeURIComponent(JSON.stringify(data)) + " %}";
      },
      toPreview: function (data) {
        var photos = (data && data.photos) || [];
        var imgs = photos
          .map(function (p) {
            var url = p && (p.image || p);
            if (!url) return "";
            return '<img src="' + url + '" style="width:23%;margin:1%;border-radius:4px;">';
          })
          .join("");
        return (
          '<div style="border:1px dashed #aaa;padding:0.6em;background:#fafafa;border-radius:6px;">' +
          '<div style="font-size:0.85em;color:#555;margin-bottom:0.3em;">📷 Gallery (' +
          photos.length +
          " photo" +
          (photos.length === 1 ? "" : "s") +
          ")</div>" +
          imgs +
          (data && data.caption
            ? '<div style="text-align:center;color:#666;font-style:italic;font-size:0.9em;margin-top:0.3em;">' +
              data.caption +
              "</div>"
            : "") +
          "</div>"
        );
      }
    });
  </script>

  <!--
    =========================================================================
    "NEEDS A HUMAN" NOTICE
    =========================================================================
    Almost everything on the site is computed from the posts and trips, so it
    cannot quietly go out of date. A few files are typed by hand — the status
    bar, the personal bests on /stats/, the country flags — and those rot
    silently: a stale status bar looks exactly like a fresh one.

    /admin-stats/ has always listed them, but only for someone who thinks to
    open it. This brings the count to where she already is, once per editor
    session, with a link to the detail.

    The list comes from /admin-upkeep.json, which is generated at build time
    from the same include /admin-stats/ renders, so the two can never
    disagree. If the fetch fails — offline, or the file not built yet —
    nothing is shown at all. A broken reminder should be invisible, not a
    scary error in an editor she is trying to write in.
    =========================================================================
  -->
  <script>
    (function () {
      // Once per session: seeing it on every save would train her to ignore it.
      try {
        if (sessionStorage.getItem("upkeep-notice-dismissed") === "1") return;
      } catch (e) { /* private mode — just show it */ }

      function show(count) {
        var bar = document.createElement("div");
        bar.style.cssText =
          "position:fixed;bottom:0;left:0;right:0;padding:10px 16px;" +
          "background:#fbf7ef;border-top:1px solid #e7dcc7;color:#3d3226;" +
          "font:14px/1.45 system-ui,sans-serif;text-align:center;" +
          "z-index:2147483646;box-shadow:0 -2px 8px rgba(0,0,0,0.08);";

        var text = document.createElement("span");
        text.textContent = count === 1
          ? "1 thing on the site needs updating by hand. "
          : count + " things on the site need updating by hand. ";
        bar.appendChild(text);

        var link = document.createElement("a");
        link.href = "/admin-stats/";
        link.target = "_blank";
        link.rel = "noopener";
        link.textContent = "See what";
        link.style.cssText = "color:#1F4858;font-weight:600;";
        bar.appendChild(link);

        var close = document.createElement("button");
        close.type = "button";
        close.textContent = "Dismiss";
        close.style.cssText =
          "margin-left:14px;border:1px solid #d8cbb4;background:#fff;" +
          "border-radius:6px;padding:3px 10px;cursor:pointer;color:#3d3226;";
        close.addEventListener("click", function () {
          try { sessionStorage.setItem("upkeep-notice-dismissed", "1"); } catch (e) {}
          bar.remove();
        });
        bar.appendChild(close);

        document.body.appendChild(bar);
      }

      fetch("/admin-upkeep.json", { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (data && typeof data.count === "number" && data.count > 0) show(data.count);
        })
        .catch(function () { /* say nothing */ });
    })();
  </script>
</body>
