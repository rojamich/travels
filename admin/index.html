<!doctype html>
<html lang="en">
<!--
  =============================================================================
  /admin/index.html — entry point for the visual content editor
  =============================================================================
  This page IS the editor. When your wife visits /admin/ she'll see a
  Netlify Identity login prompt; once logged in, Decap CMS loads the posts
  from the GitHub repo and presents them as a form-based editor.

  Photos uploaded inside the editor go to Cloudinary (configured in
  /admin/config.yml). Content saved goes back to the GitHub repo via
  Netlify's Git Gateway, which triggers a Netlify rebuild.

  No build step or front matter on this file — Jekyll passes it through
  to the published site as-is.
  =============================================================================
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Blog · Editor</title>
  <link rel="icon" href="data:," />
</head>
<body>
  <!-- Decap CMS itself (the admin UI) -->
  <script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>

  <!-- Cloudinary media library plugin for Decap (drag-and-drop uploads) -->
  <script src="https://unpkg.com/decap-cms-media-library-cloudinary@^3.0.0/dist/decap-cms-media-library-cloudinary.js"></script>

  <!-- Netlify Identity widget for login (handles invitation, password, sessions) -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <!--
    =========================================================================
    JWT AUTO-REFRESH + REDIRECT TO CUSTOM LOGIN
    =========================================================================
    Netlify Identity JWTs default to a 1-hour lifetime. Without explicit
    refresh, a long writing session ends with "unable to save" errors that
    can lose all pending edits.

    Multi-layer refresh strategy:
      1. Every 20 minutes (down from 45), force-refresh the JWT.
      2. Whenever the tab regains focus after being backgrounded, refresh
         the JWT — this catches the common case of leaving the editor for
         30+ minutes and coming back to a stale token.
      3. Track consecutive refresh failures; if 3 in a row, show a red
         banner asking her to log out and back in before her save fails.
      4. If the user lands on /admin/ without a session, send them to
         /login/ instead of Decap's iframe widget.
    =========================================================================
  -->
  <script>
    (function () {
      var consecutiveFailures = 0;
      var lastRefreshMs = 0;
      var banner = null;
      var deadSessionModal = null;
      var sessionIsDead = false;

      function whenReady(cb, tries) {
        tries = tries || 0;
        if (window.netlifyIdentity) cb();
        else if (tries < 50) setTimeout(function () { whenReady(cb, tries + 1); }, 100);
      }

      function showBanner() {
        if (banner) return;
        banner = document.createElement("div");
        banner.textContent = "⚠️ Your login may be expiring soon. Save what you have now, then log out (top-right) and log back in before writing more. Otherwise the next save can fail and lose your work.";
        banner.style.cssText =
          "position:fixed;top:0;left:0;right:0;padding:12px 20px;" +
          "background:#d9534f;color:#fff;font-size:14px;font-weight:bold;" +
          "text-align:center;z-index:2147483647;box-shadow:0 2px 8px rgba(0,0,0,0.3);";
        document.body.appendChild(banner);
      }
      function hideBanner() {
        if (banner) { banner.remove(); banner = null; }
      }

      // -----------------------------------------------------------------
      // Dead-session modal — the real fix for the "meeting break" case.
      // -----------------------------------------------------------------
      // When she leaves the tab open through a long break, the JWT
      // expires at 60 min and eventually the refresh_token itself becomes
      // invalid (or gotrue-js loses it). The old behavior was silent —
      // she'd come back, write for 20 minutes, hit save, and lose it.
      //
      // Now: as soon as we detect the session is dead (refresh failure OR
      // health-check 401 OR save-click refresh fail), we show a blocking
      // modal. She can't accidentally write more on a dead session. Her
      // current editor content stays in the DOM (and in the safety-net
      // localStorage snapshots). On successful re-login the modal
      // dismisses and she picks up exactly where she left off.
      function showDeadSessionModal(reason) {
        if (deadSessionModal) return;
        sessionIsDead = true;
        console.warn("[admin] session marked DEAD (" + reason + ") — blocking further saves until re-login");

        deadSessionModal = document.createElement("div");
        deadSessionModal.id = "dead-session-modal";
        deadSessionModal.innerHTML =
          "<div style='background:#fff;padding:28px 32px;border-radius:12px;max-width:480px;" +
          "box-shadow:0 8px 40px rgba(0,0,0,0.35);text-align:center;'>" +
          "<div style='font-size:42px;margin-bottom:12px;'>🔒</div>" +
          "<h2 style='margin:0 0 12px 0;font-size:20px;color:#2a4d69;'>Your session has expired</h2>" +
          "<p style='margin:0 0 8px 0;color:#333;font-size:14px;line-height:1.5;'>" +
          "Your login timed out (this happens after ~1 hour of inactivity or a long break). " +
          "Please sign in again to save your work." +
          "</p>" +
          "<p style='margin:0 0 20px 0;color:#666;font-size:12px;line-height:1.4;'>" +
          "Your current draft content is safe — it stays in the editor and in your local backup. " +
          "Nothing is lost by signing in again." +
          "</p>" +
          "<button id='dead-session-signin' style='background:#2a4d69;color:#fff;border:none;" +
          "padding:12px 28px;border-radius:6px;font-size:15px;font-weight:bold;cursor:pointer;'>" +
          "Sign in again</button>" +
          "</div>";
        deadSessionModal.style.cssText =
          "position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;" +
          "align-items:center;justify-content:center;z-index:2147483647;" +
          "font-family:system-ui,sans-serif;";
        document.body.appendChild(deadSessionModal);

        document.getElementById("dead-session-signin").addEventListener("click", function () {
          if (window.netlifyIdentity) {
            netlifyIdentity.open("login");
            netlifyIdentity.on("login", function () {
              hideDeadSessionModal();
              netlifyIdentity.close();
              // reload to reset Decap's internal state cleanly
              setTimeout(function () { location.reload(); }, 500);
            });
          } else {
            window.location.href = "/login/";
          }
        });
      }
      function hideDeadSessionModal() {
        if (deadSessionModal) { deadSessionModal.remove(); deadSessionModal = null; }
        sessionIsDead = false;
      }

      // Returns a promise so save-click code can await freshness.
      function refreshNow(reason) {
        var u = window.netlifyIdentity && netlifyIdentity.currentUser && netlifyIdentity.currentUser();
        if (!u || !u.jwt) return Promise.resolve(false);
        // Dedupe: don't spam when visibility toggles or clicks are rapid.
        // (Save-click bypasses this — see refreshNowForced.)
        if (Date.now() - lastRefreshMs < 60 * 1000) return Promise.resolve(true);
        return u.jwt(true)
          .then(function () {
            lastRefreshMs = Date.now();
            consecutiveFailures = 0;
            hideBanner();
            console.log("[admin] JWT refreshed (" + reason + ")");
            return true;
          })
          .catch(function (err) {
            consecutiveFailures++;
            console.warn("[admin] JWT refresh failed (" + reason + ", failure #" + consecutiveFailures + "):", err && err.message);
            // Dead-session criteria: refresh_token expired / invalid → the
            // error is usually "invalid_grant" or similar. Any refresh
            // failure that isn't a plain network hiccup should trigger
            // the modal — err on the side of blocking.
            if (consecutiveFailures >= 2) showDeadSessionModal("refresh:" + reason);
            else showBanner();
            return false;
          });
      }

      // -----------------------------------------------------------------
      // Session health-check ping.
      // -----------------------------------------------------------------
      // Even when she's active, we probe git-gateway every 5 minutes with
      // the current token. A 401 response is the ground truth for a dead
      // session — surface the modal immediately, before her next Save.
      function healthCheck() {
        if (sessionIsDead) return;
        var u = window.netlifyIdentity && netlifyIdentity.currentUser && netlifyIdentity.currentUser();
        if (!u) return;
        u.jwt().then(function (token) {
          fetch("/.netlify/git/github/user", {
            headers: { "Authorization": "Bearer " + token }
          }).then(function (res) {
            if (res.status === 401 || res.status === 403) {
              showDeadSessionModal("health-check:" + res.status);
            }
          }).catch(function () {
            // Network failure — don't block on this, could be offline.
          });
        }).catch(function () {
          showDeadSessionModal("health-check:no-jwt");
        });
      }

      // -----------------------------------------------------------------
      // Multi-tab detector.
      // -----------------------------------------------------------------
      // gotrue-js stores tokens in localStorage. When Tab A refreshes the
      // JWT, the old refresh_token is INVALIDATED on the server. Tab B is
      // still holding that stale token — its next save fails with
      // "ACCESS_TOKEN_ERROR: Failed getting access token". Any unsaved
      // content in Tab B is then lost on refresh.
      //
      // We use the BroadcastChannel API to detect a sibling admin tab and
      // show a red warning banner in whichever tab was second. She can
      // still work in it — but the banner tells her the risk clearly.
      (function () {
        try {
          var bc = new BroadcastChannel("travel-admin-tabs");
          var iAmSecond = false;
          bc.postMessage({ type: "hello", ts: Date.now() });
          bc.onmessage = function (e) {
            if (e.data && e.data.type === "hello" && !iAmSecond) {
              // Another tab exists and it was here first (it responds).
              iAmSecond = true;
              showMultiTabBanner();
              bc.postMessage({ type: "ack" });
            } else if (e.data && e.data.type === "ack") {
              // Someone else's hello — respond so THEY know we're first.
              bc.postMessage({ type: "ack" });
            }
          };
        } catch (e) {
          // BroadcastChannel not supported — fall back silently.
        }
      })();

      function showMultiTabBanner() {
        if (document.getElementById("multi-tab-banner")) return;
        var b = document.createElement("div");
        b.id = "multi-tab-banner";
        b.innerHTML =
          "⚠️ <strong>Another editor tab is open.</strong> " +
          "Multiple tabs cause save failures and can lose your work. " +
          "Close the other tab before saving here.";
        b.style.cssText =
          "position:fixed;top:0;left:0;right:0;padding:10px 20px;" +
          "background:#f0ad4e;color:#fff;font-size:14px;font-weight:bold;" +
          "text-align:center;z-index:2147483646;box-shadow:0 2px 8px rgba(0,0,0,0.3);";
        document.body.appendChild(b);
      }

      // -----------------------------------------------------------------
      // Autosave-to-localStorage safety net (aggressive version).
      // -----------------------------------------------------------------
      // Independent of Decap's git-gateway save flow. Snapshots every
      // editor's content to localStorage and — critically — keeps a
      // rolling history of the last N snapshots per editor rather than
      // overwriting a single key. That way, if a save fails and Decap
      // resets the DOM to the last-known-good state, we still have the
      // pre-error content history to recover from.
      //
      // Snapshots trigger on:
      //   - every keystroke/paste (input event), debounced 1.5s
      //   - every 5 seconds (fallback if input events don't fire)
      //   - tab hide (visibilitychange) and page unload — final capture
      //
      // Recovery commands (console):
      //   RECOVERY_LATEST()        → prints newest snapshot per editor
      //   RECOVERY_HISTORY()       → prints all snapshots with timestamps
      //   RECOVERY_COPY(N)         → copies snapshot #N's content to clipboard
      //
      // Snapshots older than 14 days are cleaned up on load. Max ~20
      // snapshots per editor key to keep localStorage size bounded.
      (function () {
        var SNAP_PREFIX = "editor-snapshot:";      // legacy single-slot key
        var HIST_PREFIX = "editor-history:";       // rolling history array
        var MAX_AGE_MS  = 14 * 24 * 60 * 60 * 1000;
        var MAX_HIST    = 20;
        var lastContent = {};                       // key → last stored content

        function cleanOld() {
          try {
            var now = Date.now();
            Object.keys(localStorage).forEach(function (k) {
              if (k.indexOf(SNAP_PREFIX) !== 0 && k.indexOf(HIST_PREFIX) !== 0) return;
              try {
                var raw = JSON.parse(localStorage.getItem(k));
                var newest = 0;
                if (Array.isArray(raw)) {
                  raw.forEach(function (e) { if (e && e.ts > newest) newest = e.ts; });
                } else if (raw && raw.ts) {
                  newest = raw.ts;
                }
                if (newest && (now - newest) > MAX_AGE_MS) localStorage.removeItem(k);
              } catch (e) {
                localStorage.removeItem(k);
              }
            });
          } catch (e) {}
        }

        function collectEditors() {
          return document.querySelectorAll(
            'textarea, [contenteditable="true"], [role="textbox"]'
          );
        }

        function snapshot(reason) {
          try {
            var editors = collectEditors();
            var totalLen = 0;
            var changedKeys = [];
            editors.forEach(function (el, i) {
              var val = el.value || el.innerText || "";
              if (val.length < 100) return;
              totalLen += val.length;
              var key = (el.id || el.name || ("editor-" + i));
              // Skip if content unchanged since last capture — avoids
              // storing duplicate snapshots on the 5s interval.
              if (lastContent[key] === val) return;
              lastContent[key] = val;
              changedKeys.push(key);

              // 1) Legacy single-slot key (for backwards-compat).
              localStorage.setItem(SNAP_PREFIX + key, JSON.stringify({
                ts: Date.now(), url: location.href, len: val.length, content: val
              }));
              // 2) Rolling history — append + trim.
              var histKey = HIST_PREFIX + key;
              var hist;
              try { hist = JSON.parse(localStorage.getItem(histKey)) || []; }
              catch (e) { hist = []; }
              hist.push({ ts: Date.now(), url: location.href, len: val.length, content: val });
              if (hist.length > MAX_HIST) hist = hist.slice(-MAX_HIST);
              try {
                localStorage.setItem(histKey, JSON.stringify(hist));
              } catch (quotaErr) {
                // Quota exceeded — drop oldest half of history and retry.
                hist = hist.slice(-Math.floor(MAX_HIST / 2));
                try { localStorage.setItem(histKey, JSON.stringify(hist)); } catch (e2) {}
              }
            });
            if (changedKeys.length > 0) {
              console.log("[safety-net] " + reason + " → snapshot " + totalLen +
                          " chars, changed: " + changedKeys.join(", "));
            }
          } catch (e) {
            console.warn("[safety-net] snapshot failed:", e && e.message);
          }
        }

        // Debounced input handler — catches every keystroke within 1.5s.
        var inputTimer = null;
        document.addEventListener("input", function () {
          if (inputTimer) clearTimeout(inputTimer);
          inputTimer = setTimeout(function () { snapshot("input"); }, 1500);
        }, true);

        // Also fire on tab hide / page unload as a last-chance capture.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") snapshot("hide");
        });
        window.addEventListener("pagehide", function () { snapshot("pagehide"); });
        window.addEventListener("beforeunload", function () { snapshot("beforeunload"); });

        cleanOld();
        setInterval(function () { snapshot("interval"); }, 5 * 1000);   // was 30s

        // Recovery helpers exposed on window for console use.
        window.RECOVERY_LATEST = function () {
          Object.keys(localStorage)
            .filter(function (k) { return k.indexOf(SNAP_PREFIX) === 0; })
            .forEach(function (k) {
              try {
                var v = JSON.parse(localStorage.getItem(k));
                console.log(k, "(" + new Date(v.ts).toLocaleString() + ", " + v.len + " chars)");
                console.log(v.content);
              } catch (e) {}
            });
        };
        window.RECOVERY_HISTORY = function () {
          Object.keys(localStorage)
            .filter(function (k) { return k.indexOf(HIST_PREFIX) === 0; })
            .forEach(function (k) {
              try {
                var arr = JSON.parse(localStorage.getItem(k)) || [];
                console.log("=== " + k + " (" + arr.length + " snapshots) ===");
                arr.forEach(function (e, i) {
                  console.log("  #" + i + " " + new Date(e.ts).toLocaleString() +
                              " → " + e.len + " chars");
                });
              } catch (e) {}
            });
        };
        window.RECOVERY_COPY = function (idxFromEnd) {
          idxFromEnd = idxFromEnd || 0;   // 0 = newest
          var found = null;
          Object.keys(localStorage)
            .filter(function (k) { return k.indexOf(HIST_PREFIX) === 0; })
            .forEach(function (k) {
              try {
                var arr = JSON.parse(localStorage.getItem(k)) || [];
                var entry = arr[arr.length - 1 - idxFromEnd];
                if (entry && (!found || entry.ts > found.ts)) found = entry;
              } catch (e) {}
            });
          if (found && window.copy) {
            window.copy(found.content);
            console.log("copied " + found.len + " chars from " +
                        new Date(found.ts).toLocaleString() + " to clipboard");
          } else if (found) {
            console.log("copy() unavailable — content follows:");
            console.log(found.content);
          } else {
            console.log("no snapshot found at index " + idxFromEnd);
          }
        };
      })();

      whenReady(function () {
        netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.location.href = "/login/";
          } else {
            lastRefreshMs = Date.now();
          }
        });

        // Layer 1: periodic refresh (every 10 min — tightened from 20).
        setInterval(function () { refreshNow("periodic"); }, 10 * 60 * 1000);

        // Layer 2: refresh when the tab regains focus. Most token errors
        // happen when she comes back to /admin/ after being away for a
        // while — refresh proactively before she clicks Save.
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") refreshNow("visibilitychange");
        });
        window.addEventListener("focus", function () { refreshNow("focus"); });

        // Layer 3: refresh on every Save / Publish click.
        // ---------------------------------------------------------------
        // Save-click pointerdown triggers a JWT refresh a few ms BEFORE
        // the click reaches Decap's handler. If the refresh SUCCEEDS,
        // gotrue-js has a fresh token by the time save runs. If it
        // FAILS, refreshNow() surfaces the dead-session modal — and we
        // additionally hard-block the save event here so a stale-token
        // request never even fires.
        function looksLikeSaveButton(el) {
          if (!el || el.nodeType !== 1) return false;
          var text = (el.textContent || "").trim().toLowerCase();
          if (text.length > 40) return false;
          return /^(save|publish|publish now|save and publish|set status|set status:|new|delete)/.test(text) ||
                 /^(save|publish)/.test((el.getAttribute("aria-label") || "").toLowerCase());
        }
        document.addEventListener("pointerdown", function (e) {
          var el = e.target;
          for (var depth = 0; depth < 5 && el; depth++) {
            if (looksLikeSaveButton(el)) {
              if (sessionIsDead) {
                // Block the click outright and surface the modal.
                e.preventDefault();
                e.stopImmediatePropagation();
                showDeadSessionModal("save-click-while-dead");
                return;
              }
              refreshNow("save-click");
              return;
            }
            el = el.parentElement;
          }
        }, true);

        // Layer 5: periodic session health check.
        // ---------------------------------------------------------------
        // Every 5 min while the tab is visible, ping git-gateway with
        // the current token. A 401 is the ground truth for a dead
        // session — surface the modal immediately, well before her next
        // Save. This is the fix for the "meeting break" case: even if
        // she comes back and doesn't touch anything for a while, we
        // detect the dead session in the background and stop her from
        // writing on it unknowingly.
        setInterval(function () {
          if (document.visibilityState === "visible") healthCheck();
        }, 5 * 60 * 1000);
        // Also fire once shortly after load in case the initial 401s
        // (Decap's user-verify calls) already indicated a dead session.
        setTimeout(healthCheck, 8 * 1000);

        // Layer 4: mint a persistent "backup indicator" that shows when the
        // safety net last snapshotted her work. Peace of mind + easy check
        // that snapshots are actually running.
        function updateBackupIndicator() {
          var ind = document.getElementById("backup-indicator");
          if (!ind) {
            ind = document.createElement("div");
            ind.id = "backup-indicator";
            ind.style.cssText =
              "position:fixed;bottom:18px;left:18px;padding:6px 12px;" +
              "background:rgba(42,77,105,0.9);color:#fff;font-size:11px;" +
              "border-radius:6px;z-index:2147483645;pointer-events:none;" +
              "font-family:system-ui,sans-serif;";
            document.body.appendChild(ind);
          }
          try {
            var keys = Object.keys(localStorage).filter(function (k) {
              return k.indexOf("editor-snapshot:") === 0;
            });
            if (keys.length === 0) {
              ind.textContent = "💾 Backup: no draft yet";
              return;
            }
            var newest = 0;
            keys.forEach(function (k) {
              try {
                var o = JSON.parse(localStorage.getItem(k));
                if (o && o.ts && o.ts > newest) newest = o.ts;
              } catch (e) {}
            });
            var mins = Math.round((Date.now() - newest) / 60000);
            ind.textContent = "💾 Backup: " + (mins < 1 ? "just now" : mins + "m ago");
          } catch (e) {}
        }
        setInterval(updateBackupIndicator, 15 * 1000);
        setTimeout(updateBackupIndicator, 2000);
      });
    })();
  </script>

  <!--
    =========================================================================
    EDITOR COMPONENTS — custom blocks she can insert in the post body
    =========================================================================
    The "📷 Photo Gallery" button appears in the markdown editor's toolbar.
    Clicking it opens a form: she picks one or more photos (via Cloudinary)
    and optionally adds a caption. On save, a {% gallery_block ... %} tag is
    written into the markdown at her cursor position. At build time, the
    Jekyll plugin in _plugins/gallery_block.rb converts that tag into a
    styled grid of clickable photos.
    =========================================================================
  -->
  <script>
    // ----- "🙂 Inline Emoji Picker" -----
    // Decap's CMS.registerEditorComponent always creates BLOCK-level elements,
    // which forced emojis onto their own line. Instead we render a floating
    // button (bottom-right of /admin/) that opens an emoji grid. Clicking an
    // emoji refocuses the last-active editable element and inserts the emoji
    // character at the cursor — staying inline with surrounding text.
    //
    // For anything not on the list, the OS emoji picker still works inline:
    // Win+. on Windows, Ctrl+Cmd+Space on Mac.
    (function () {
      var EMOJIS = [
        // Travel / transport
        "✈️","🚗","🚆","🛵","🏍️","🚢","🛶","🚁","🌍","🌏","🌎","🗺️","📍","🧳","🎒","🛏️","⛺",
        // Nature / scenery
        "🏔️","🌋","🏖️","🏝️","🌅","🌄","🌇","🌌","🌳","🌴","🌊","❄️","☀️","⛅","🌧️","🌈",
        // Animals
        "🐅","🐘","🦒","🦓","🐆","🐧","🐠","🐢","🐑","🐕",
        // Food / drink
        "🍜","🍣","🍕","🥖","🥐","🌮","🍔","🍦","🍫","🍷","🍺","☕","🧉",
        // Buildings / culture
        "🏰","🕌","⛩️","🛕","⛪","🗽","🗼","🏛️",
        // Activities
        "🥾","🚴","🏊","🧗","📸","🎫","🎟️",
        // Reactions
        "❤️","💗","✨","🌟","😍","🥰","😋","😮","😂","🤣","🥹","😴","🥺"
      ];

      // Track the last text-editable element that had focus, so the picker
      // can restore focus and insert into it after the user clicks an emoji.
      var lastEditable = null;
      function isEditable(el) {
        if (!el) return false;
        if (el.tagName === "TEXTAREA" || el.tagName === "INPUT") return true;
        if (el.isContentEditable) return true;
        return false;
      }
      document.addEventListener("focusin", function (e) {
        if (isEditable(e.target)) lastEditable = e.target;
      }, true);

      function insertAtCursor(text) {
        var el = lastEditable;
        if (!el || !document.body.contains(el)) return false;
        el.focus();

        if (el.tagName === "TEXTAREA" || el.tagName === "INPUT") {
          var start = el.selectionStart, end = el.selectionEnd, val = el.value;
          el.value = val.slice(0, start) + text + val.slice(end);
          var pos = start + text.length;
          el.setSelectionRange(pos, pos);
          el.dispatchEvent(new Event("input", { bubbles: true }));
          return true;
        }

        // contenteditable (Decap's Slate-based markdown editor)
        // execCommand is deprecated but it's the only API that Slate's
        // beforeinput listeners reliably pick up, so the edit stays in sync.
        var ok = document.execCommand && document.execCommand("insertText", false, text);
        if (!ok) {
          // Fallback: raw Range API
          var sel = window.getSelection();
          if (sel && sel.rangeCount) {
            var range = sel.getRangeAt(0);
            range.deleteContents();

    // ----- "🎯 Photo Positioner" -----
    // Floating button (bottom-right of /admin/, left of the emoji button) that
    // opens a modal letting the user drag the photo around inside a preview
    // box matching the actual render aspect ratio. The image is NOT cropped;
    // we just compute object-position percentages (0–100 for X and Y) and
    // write them back into the hidden focal_x / focal_y number fields on the
    // current Decap form. The render side then applies object-position
    // (for <img> thumbnails) or background-position (for the MM banner div).
    //
    // Why label-based DOM scraping: Decap doesn't expose its React form state
    // to user scripts. The reliable way to read the image URL and write back
    // the focal values is to find the rendered inputs by their label text and
    // manipulate them via React's nativeInputValueSetter trick so the form
    // state stays consistent and the change persists on Save.
    //
    // The whole IIFE is wrapped in try/catch with logging so a runtime error
    // here can never block the rest of the admin (especially saving).
    try {
    (function () {
      // Each entry describes one photo field that the positioner can target.
      //   labelMatch: front of the label text Decap will render (we use
      //               startsWith so trailing required markers don't break it).
      //   focalXLabel / focalYLabel: labels of the two number inputs to write.
      //   box: { w, h } pixel size of the preview box in the modal — choose
      //        an aspect ratio that matches how the photo is used on the site.
      var FIELDS = [
        { key: "cover",   tab: "Trip cover",       labelMatch: "Cover photo",
          focalXLabel: "Cover — focal X (0–100)",
          focalYLabel: "Cover — focal Y (0–100)",
          box: { w: 360, h: 240 },
          desc: "Shows as the trip card on the homepage (3:2)." },
        { key: "teaser",  tab: "Post teaser",      labelMatch: "Teaser (small thumbnail in listings)",
          focalXLabel: "Teaser — focal X (0–100)",
          focalYLabel: "Teaser — focal Y (0–100)",
          box: { w: 400, h: 280 },
          desc: "Shows as the day thumbnail on the trip page (10:7)." },
        { key: "overlay", tab: "Post banner",      labelMatch: "Banner (large image at top of post)",
          focalXLabel: "Banner — focal X (0–100)",
          focalYLabel: "Banner — focal Y (0–100)",
          box: { w: 480, h: 160 },
          desc: "The wide banner at the top of the post page (3:1)." }
      ];

      // ----- DOM scraping helpers -----
      // Walk all <label>s in the form; match by startsWith so we tolerate the
      // little extras Decap may append (asterisks, hints, colons).
      function eachLabel(text, fn) {
        var labels = document.querySelectorAll("label, span[class*='label']");
        for (var i = 0; i < labels.length; i++) {
          var t = (labels[i].textContent || "").trim();
          if (t === text || t.indexOf(text) === 0) {
            if (fn(labels[i]) === false) return;
          }
        }
      }
      function findFieldContainer(labelText) {
        var found = null;
        eachLabel(labelText, function (lbl) {
          var parent = lbl.parentElement;
          for (var d = 0; d < 5 && parent; d++) {
            if (parent.querySelector("input, textarea, img")) { found = parent; return false; }
            parent = parent.parentElement;
          }
        });
        return found;
      }
      function readImageUrl(container) {
        if (!container) return "";
        // The image widget renders a preview <img> whose src is the current URL.
        var img = container.querySelector("img");
        if (img && img.src && img.src.indexOf("data:") !== 0) return img.src;
        var input = container.querySelector("input[type='text'], input[type='url']");
        return input ? input.value : "";
      }
      function findNumberInput(labelText) {
        var found = null;
        eachLabel(labelText, function (lbl) {
          var parent = lbl.parentElement;
          for (var d = 0; d < 5 && parent; d++) {
            var input = parent.querySelector("input[type='number']");
            if (input) { found = input; return false; }
            parent = parent.parentElement;
          }
        });
        return found;
      }
      // React-controlled inputs ignore plain `input.value = x`. We have to call
      // the prototype's native setter and dispatch an input event so React's
      // synthetic onChange picks it up and updates state.
      function setReactValue(input, value) {
        if (!input) return;
        var setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, "value").set;
        setter.call(input, String(value));
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.dispatchEvent(new Event("change", { bubbles: true }));
      }
      function readFocalValue(input, fallback) {
        if (!input) return fallback;
        var v = parseFloat(input.value);
        if (isNaN(v) || v < 0 || v > 100) return fallback;
        return v;
      }

      // ----- Drag mechanics -----
      // Single shared drag state across the whole positioner. Global mouse /
      // touch listeners are attached ONCE at module init (not per bindDrag
      // call) so repeatedly opening the modal or switching tabs doesn't stack
      // duplicate listeners on document. Each bindDrag call just swaps the
      // currentDrag pointer; an inactive currentDrag is a no-op for the
      // global handlers.
      var currentDrag = null;
      function clamp01(v) { return Math.max(0, Math.min(100, v)); }
      function doMove(clientX, clientY) {
        if (!currentDrag || !currentDrag.dragging) return;
        var d = currentDrag;
        var dx = clientX - d.sx, dy = clientY - d.sy;
        d.state.x = d.overflowX > 0 ? clamp01(d.sfx - (dx / d.overflowX) * 100) : d.sfx;
        d.state.y = d.overflowY > 0 ? clamp01(d.sfy - (dy / d.overflowY) * 100) : d.sfy;
        d.render();
      }
      function doEnd() {
        if (!currentDrag || !currentDrag.dragging) return;
        currentDrag.dragging = false;
        document.body.style.userSelect = "";
        if (currentDrag.box) currentDrag.box.style.cursor = "grab";
      }
      document.addEventListener("mousemove", function (e) { doMove(e.clientX, e.clientY); });
      document.addEventListener("mouseup",   doEnd);
      document.addEventListener("touchmove", function (e) {
        if (!currentDrag || !currentDrag.dragging || !e.touches[0]) return;
        doMove(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: false });
      document.addEventListener("touchend", doEnd);

      function bindDrag(box, img, state, render) {
        function recompute() {
          var bw = box.clientWidth, bh = box.clientHeight;
          var iw = img.naturalWidth, ih = img.naturalHeight;
          if (!iw || !ih || !currentDrag) return;
          var imgAR = iw / ih, boxAR = bw / bh;
          var rW, rH;
          if (imgAR > boxAR) { rH = bh; rW = bh * imgAR; }
          else                { rW = bw; rH = bw / imgAR; }
          currentDrag.overflowX = Math.max(0, rW - bw);
          currentDrag.overflowY = Math.max(0, rH - bh);
        }

        // Replace whatever was the active drag context with this new one.
        currentDrag = {
          box: box, img: img, state: state, render: render,
          dragging: false, sx: 0, sy: 0, sfx: 50, sfy: 50,
          overflowX: 0, overflowY: 0
        };

        if (img.complete) recompute();
        img.addEventListener("load", function () { recompute(); render(); });

        function start(clientX, clientY) {
          if (!currentDrag) return;
          currentDrag.dragging = true;
          currentDrag.sx = clientX; currentDrag.sy = clientY;
          currentDrag.sfx = state.x; currentDrag.sfy = state.y;
          document.body.style.userSelect = "none";
          box.style.cursor = "grabbing";
        }

        box.addEventListener("mousedown", function (e) { e.preventDefault(); start(e.clientX, e.clientY); });
        box.addEventListener("touchstart", function (e) {
          if (!e.touches[0]) return;
          e.preventDefault();
          start(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: false });
      }

        style.textContent =

        document.head.appendChild(style);

        modal = document.createElement("div");
        modal.id = "photo-pos-modal";
        modal.innerHTML =
          "<div class='modal-card'>" +
          "  <h3>🎯 Position your photo</h3>" +
          "  <div class='modal-sub'>Drag the photo to choose which part shows in the thumbnail or banner. The photo isn't cropped — it just shifts inside the frame.</div>" +
          "  <div class='modal-body'></div>" +
          "</div>";
        document.body.appendChild(modal);
        modalBody = modal.querySelector(".modal-body");

        // Click outside the card closes the modal (without saving).
        modal.addEventListener("click", function (ev) {
          if (ev.target === modal) closeModal();
        });
      }

      function openModal() {
        buildModal();

        // changed in the modal but hasn't yet saved back to the form.
        var available = FIELDS.map(function (f) {
          var container = findFieldContainer(f.labelMatch);
          var url = readImageUrl(container);
          var fxIn = findNumberInput(f.focalXLabel);
          var fyIn = findNumberInput(f.focalYLabel);
          return {
            cfg: f,
            url: url,
            hasFields: !!(fxIn && fyIn),
            fxInput: fxIn,
            fyInput: fyIn,
            pending: { x: readFocalValue(fxIn, 50), y: readFocalValue(fyIn, 50) }
          };
        }).filter(function (e) { return e.hasFields; });

        if (available.length === 0) {

            "<div class='nofields'>" +

        function render() {

              "<button type='button' class='reset'>Reset to center (50, 50)</button>" +

          return JSON.parse(decodeURIComponent(match[1]));
        } catch (e) {
          return { audio: "", title: "" };
        }
      },
      toBlock: function (data) {
        return "{% audio_block " + encodeURIComponent(JSON.stringify(data)) + " %}";
      },
      toPreview: function (data) {
        var title = (data && data.title) ? data.title : "(audio clip)";
        var url = (data && data.audio) || "";
        return (
          '<div style="border:1px dashed #aaa;padding:0.6em;background:#fafafa;border-radius:6px;">' +
          '<div style="font-size:0.85em;color:#555;">🎵 ' + title + '</div>' +
          (url ? '<audio controls preload="none" src="' + url + '" style="width:100%;margin-top:0.5em;"></audio>' : '<div style="color:#aaa;">(no audio uploaded yet)</div>') +
          "</div>"
        );
      }
    });

    // ----- "📷 Photo Gallery" -----
    CMS.registerEditorComponent({
      id: "gallery",
      label: "📷 Photo Gallery",
      fields: [
        {
          name: "photos",
          label: "Photos",
          widget: "list",
          summary: "{{fields.image}}",
          field: {
            name: "image",
            label: "Image",
            widget: "image",
            hint: "Click here, then upload or pick a photo. Repeat 'Add' to add more."
          },
          hint: "Add as many photos as you want — they'll render in a grid."
        },
        {
          name: "caption",
          label: "Caption (optional)",
          widget: "string",
          required: false,
          hint: "Shown below the gallery in italic."
        }
      ],
      pattern: /\{%\s*gallery_block\s+(\S+)\s*%\}/,
      fromBlock: function (match) {
        try {
          return JSON.parse(decodeURIComponent(match[1]));
        } catch (e) {
          return { photos: [], caption: "" };
        }
      },
      toBlock: function (data) {
        return "{% gallery_block " + encodeURIComponent(JSON.stringify(data)) + " %}";
      },
      toPreview: function (data) {
        var photos = (data && data.photos) || [];
        var imgs = photos
          .map(function (p) {
            var url = p && (p.image || p);
            if (!url) return "";
            return '<img src="' + url + '" style="width:23%;margin:1%;border-radius:4px;">';
          })
          .join("");
        return (
          '<div style="border:1px dashed #aaa;padding:0.6em;background:#fafafa;border-radius:6px;">' +
          '<div style="font-size:0.85em;color:#555;margin-bottom:0.3em;">📷 Gallery (' +
          photos.length +
          " photo" +
          (photos.length === 1 ? "" : "s") +
          ")</div>" +
          imgs +
          (data && data.caption
            ? '<div style="text-align:center;color:#666;font-style:italic;font-size:0.9em;margin-top:0.3em;">' +
              data.caption +
              "</div>"
            : "") +
          "</div>"
        );
      }
    });
  </script>
</body>
</html>
