          - { label: "Latitude", name: "lat", widget: "number", value_type: "float" }
          - { label: "Longitude", name: "lng", widget: "number", value_type: "float" }

      - { label: "Collection trip (groups many separate visits)",
          name: "collection",
          widget: "boolean",
          default: false,
          required: false,
          hint: "Turn ON for an entry that gathers lots of separate visits under one heading rather than being a single journey — e.g. 'Party in the USA' spanning 2011-2026. Duration stats skip these, so they can't win 'longest single trip' or inflate the days-on-the-road total. Countries and map pins still count normally." }

      - { label: "Country code (2 letters)",
          name: "country_code",
          widget: "string",
          required: false,
          hint: "e.g. 'is' for Iceland, 'jp' for Japan. Optional — used for a future country-fill feature on the map." }

      - label: "US states visited (if this trip is in the USA)"
        name: "states"
        widget: "list"
        required: false
        default: []
        collapsed: true
        hint: "Full state names as they appear on a US map, e.g. California, New York, Texas. Each state you list will get counted in the Stats page and shaded on the US coverage map. It's fine to make a placeholder trip with just states listed and no posts — you can add posts later."
        field:
          name: state
          label: "State"
          widget: string

      - { label: "Tags",
          name: "tags",
          widget: "list",
          required: false,
          default: [],
          hint: "Filter chips on the homepage. Use region (europe, asia), style (road-trip, beach), or theme (food, hiking). Lowercase + dashes." }

      - { label: "Optional intro text",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Optional. Appears below the description on the trip page, before the day-by-day list. Leave blank to skip." }

  # -------------------------------------------------------------------------
  # Posts collection — one entry per day of a trip.
  # -------------------------------------------------------------------------
  - name: "posts"
    label: "Travel Posts"
    label_singular: "Travel Post"
    description: "Each day's blog entry. Pick the trip, set the day order, write away."
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{commit_date | date('YYYY-MM-DD')}}"
    sortable_fields: ['date', 'title', 'order']
    # Group-by is DYNAMIC — Decap builds one group per distinct value of
    # `categories`, so new trips appear here automatically with no config
    # edit. Use "Group by → Trip" in the editor sidebar.
    view_groups:
      - label: "Trip"
        field: categories

    # Quick one-click filters. Decap can't generate these dynamically, so
    # they're enumerated. When you add a new trip, add a line here too —
    # or just use "Group by → Trip" above, which never needs updating.
    view_filters:
      - label: "African Safari Sojourn"
        field: categories
        pattern: "african-safari"
      - label: "Bamboo & Bulgogi Bliss"
        field: categories
        pattern: "bamboo-bulgogi"
      - label: "European Excursion"
        field: categories
        pattern: "european-excursion"
      - label: "European Exploration"
        field: categories
        pattern: "european-exploration"
      - label: "Fjords & Forever"
        field: categories
        pattern: "fjords-forever"
      - label: "Life in the Big City"
        field: categories
        pattern: "life-in-the-big-city"
      - label: "Nomadic New Zealand Adventure 2022"
        field: categories
        pattern: "new-zealand"
      - label: "Party in the USA"
        field: categories
        pattern: "party-in-the-usa"
      - label: "Peruvian Passage"
        field: categories
        pattern: "peruvian-passage"
      - label: "Red Coats & Red Buses"
        field: categories
        pattern: "red-coats-red-buses"
      - label: "The Singaporean Stopover"
        field: categories
        pattern: "the-singaporean-stopover"
      - label: "Vietnamese Voyage"
        field: categories
        pattern: "vietnam"
      - label: "Welcome Home: Tbilisi, Georgia"
        field: categories
        pattern: "welcome-home-tbilisi-georgia"
    fields:
      - { label: "Title",
          name: "title",
          widget: "string",
          hint: "The headline of the post — e.g. 'Day 3 — The South Coast'." }

      - { label: "Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          date_format: "YYYY-MM-DD" }

      - label: "Trip"
        name: "categories"
        widget: "relation"
        collection: "trips"
        search_fields: ["title", "location"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        min: 1
        max: 1
        hint: "Pick which trip this post belongs to. New trips you create show up here automatically."

      - { label: "Day order in trip",
          name: "order",
          widget: "number",
          value_type: "int",
          min: 0,
          hint: "1 = day 1, 2 = day 2. Controls sort order on the trip page." }

      - label: "Cover & banner"
        name: "header"
        widget: "object"
        hint: "The big photo at the top of the post and the thumbnail in listings."
        fields:
          - { label: "Teaser (small thumbnail in listings)",
              name: "teaser",
              widget: "image" }
          - { label: "Teaser — focal X (0–100)",
              name: "teaser_focal_x",
              widget: "number",
              required: false,
              value_type: "int",
              default: 50,
              min: 0,
              max: 100,
              hint: "Set automatically by the 🎯 Position Photo tool (floating button bottom-right). 50 = centered." }
          - { label: "Teaser — focal Y (0–100)",
              name: "teaser_focal_y",
              widget: "number",
              required: false,
              value_type: "int",
              default: 50,
              min: 0,
              max: 100 }
          - { label: "Banner (large image at top of post)",
              name: "overlay_image",
              widget: "image" }
          - { label: "Banner — focal X (0–100)",
              name: "overlay_focal_x",
              widget: "number",
              required: false,
              value_type: "int",
              default: 50,
              min: 0,
              max: 100,
              hint: "Set automatically by the 🎯 Position Photo tool. 50 = centered." }
          - { label: "Banner — focal Y (0–100)",
              name: "overlay_focal_y",
              widget: "number",
              required: false,
              value_type: "int",
              default: 50,
              min: 0,
              max: 100 }
          - { label: "Banner darkening (0–1)",
              name: "overlay_filter",
              widget: "number",
              value_type: "float",
              default: 0.4,
              min: 0,
              max: 1,
              step: 0.1,
              hint: "0 = no darkening, 1 = fully black. Higher numbers make the title text more readable on bright photos." }

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "Optional keywords (e.g. food, hiking). Leave empty if you don't care."

      - label: "Map pin location"
        name: "location"
        widget: "object"
        required: false
        collapsed: true
        hint: "Adds a pin to the trip map. Get coordinates from latlong.net. Skip the whole block for travel/rest days with no specific location."
        fields:
          - { label: "Place name",
              name: "name",
              widget: "string",
              required: false,
              hint: "e.g. Reykjavik, Iceland" }
          - { label: "Latitude",
              name: "lat",
              widget: "number",
              required: false,
              value_type: "float" }
          - { label: "Longitude",
              name: "lng",
              widget: "number",
              required: false,
              value_type: "float" }

      - label: "Photo gallery"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: true
        hint: "Photos shown together as a grid. Add a row per photo. The two image fields can be the same — upload once, click 'use existing' for the second."
        fields:
          - { label: "Image (full size)",
              name: "url",
              widget: "image" }
          - { label: "Image (thumbnail — usually same)",
              name: "image_path",
              widget: "image" }
          - { label: "Caption / alt text",
              name: "alt",
              widget: "string",
              required: false }

      - { label: "Excerpt",
          name: "excerpt",
          widget: "string",
          required: false,
          hint: "One-sentence summary shown in listings. Optional — Jekyll auto-generates one from the body if you skip this." }

      - { label: "Show table of contents",
          name: "toc",
          widget: "boolean",
          default: false,
          required: false,
          hint: "Turn on for long posts (5+ sections). Adds a sticky list of headings on the side that readers can click to jump around. Off by default." }

      - { label: "Body",
          name: "body",
          widget: "markdown",
          hint: "Write your post here. Use the toolbar above for formatting; drag photos in to upload." }
