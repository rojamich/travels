          default: [],
          hint: "Type a tag that doesn't exist yet. It works immediately \u2014 filters, counts, everything. /admin-stats/ will remind you to add it to the master list under Tags so it appears in the dropdown next time. Check the dropdown first: re-typing one that already exists with different capitals makes a second, separate filter." }

      - label: "Map pin location"
        name: "location"
        widget: "object"
        required: false
        collapsed: true
        hint: "Adds a pin to the trip map. Get coordinates from latlong.net. Skip the whole block for travel/rest days with no specific location."
        fields:
          - { label: "Place name",
              name: "name",
              widget: "string",
              required: false,
              hint: "e.g. Reykjavik, Iceland" }
          - { label: "Latitude",
              name: "lat",
              widget: "number",
              required: false,
              value_type: "float" }
          - { label: "Longitude",
              name: "lng",
              widget: "number",
              required: false,
              value_type: "float" }

      - label: "How this day counted"
        name: "stay"
        widget: "select"
        default: "night"
        required: false
        options:
          - { label: "Stayed the night here", value: "night" }
          - { label: "Day trip — went there, slept somewhere else", value: "day_trip" }
          - { label: "Layover — only passing through, not a visit", value: "layover" }
        hint: "Leave on 'Stayed the night' for an ordinary day. Choose 'Day trip' when you spent the day somewhere and slept elsewhere — a day in Chobe from a camp over the border. That still counts as visiting the country (make sure the trip lists it), it just doesn't take a night away from where you actually slept. Choose 'Layover' for nine hours in an airport or an overnight flight: the pin still shows on the map, but nothing else about the place is claimed — no night, and it doesn't count as a country visited."

      - label: "Photo gallery"
        name: "gallery"
        widget: "list"
        required: false
        collapsed: true
        hint: "Photos shown together as a grid. Add a row per photo. The two image fields can be the same — upload once, click 'use existing' for the second."
        fields:
          - { label: "Image (full size)",
              name: "url",
              widget: "image" }
          - { label: "Image (thumbnail — usually same)",
              name: "image_path",
              widget: "image" }
          - { label: "Caption / alt text",
              name: "alt",
              widget: "string",
              required: false }

      - { label: "Excerpt",
          name: "excerpt",
          widget: "string",
          required: false,
          hint: "One-sentence summary shown in listings. Optional — Jekyll auto-generates one from the body if you skip this." }

      - { label: "Show table of contents",
          name: "toc",
          widget: "boolean",
          default: false,
          required: false,
          hint: "Turn on for long posts (5+ sections). Adds a sticky list of headings on the side that readers can click to jump around. Off by default." }

      - { label: "Body",
          name: "body",
          widget: "markdown",
          hint: "Write your post here. Use the toolbar above for formatting; drag photos in to upload." }
