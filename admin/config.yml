# =============================================================================
# Decap CMS configuration
# =============================================================================
# This file defines what the admin form looks like. Each `field` here
# becomes one input on the page. The `name` of a field is what gets written
# into the post's front matter, so they must match what _config.yml and the
# layouts expect (title, date, categories, header, location, gallery, etc).
# =============================================================================

# -----------------------------------------------------------------------------
# Backend: Netlify Identity + Git Gateway
# Saves go to GitHub via Netlify; we don't need to put any GitHub token here.
# -----------------------------------------------------------------------------
backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Add post: {{slug}}'
    update: 'Edit post: {{slug}}'
    delete: 'Delete post: {{slug}}'
    uploadMedia: 'Upload {{path}}'
    deleteMedia: 'Delete {{path}}'

# -----------------------------------------------------------------------------
# Editorial workflow — drafts don't trigger builds; only Publish does
# -----------------------------------------------------------------------------
# When this is on, "Save" stores a draft on a separate branch (cms/...) and
# does NOT trigger a Netlify build. Only when she clicks "Publish" (or drags
# a card to "Ready") does the change merge to main and the site rebuild.
#
# IMPORTANT: in Netlify dashboard, Site configuration → Build & Deploy →
# Deploy Previews → set to "Don't build deploy previews". Otherwise Netlify
# builds every CMS branch and the credit savings vanish.
publish_mode: editorial_workflow

# Where the live site lives. Used by the "preview" feature.
site_url: https://where-in-the-world-are-mike-and-jen.netlify.app
display_url: https://where-in-the-world-are-mike-and-jen.netlify.app
# logo_url removed — was pointing at a now-hidden Iceland placeholder image
# and 404'd in the admin console. Add a real Cloudinary URL here if you want
# a custom logo at the top of the admin sidebar.

# -----------------------------------------------------------------------------
# Media: Cloudinary
# Photos uploaded inside the editor go straight to Cloudinary. Decap inserts
# the Cloudinary URL into the post automatically.
# -----------------------------------------------------------------------------
media_library:
  name: cloudinary
  config:
    cloud_name: dgw35sldo
    api_key: '353435959467269'

    # ------------------------------------------------------------------
    # STORAGE: shrink originals as they arrive.
    # ------------------------------------------------------------------
    # Point uploads at an upload preset that carries an INCOMING
    # transformation, so Cloudinary resizes the file before storing it
    # rather than keeping the full-size phone original forever. A modern
    # phone photo is 4-12MB; capped at 2400px it lands around 1-2MB, and
    # we only ever DELIVER at 1200px wide, so nothing visible is lost.
    #
    # This preset must be created once in the Cloudinary dashboard —
    # it can't be defined from here:
    #   Settings -> Upload -> Upload presets -> Add upload preset
    #     Preset name:   travel_blog_upload
    #     Signing mode:  Unsigned
    #     Incoming transformation:  c_limit,w_2400,q_auto:good
    #
    # Until that preset exists, leave this line commented out — pointing
    # at a preset that isn't there will make uploads fail outright.
    #
    # Worth being clear about what this does and doesn't fix: it reduces
    # STORED bytes, which is what protects the 25GB quota. It does NOT
    # make uploads faster, because the full-size file still has to travel
    # from the phone/laptop to Cloudinary first. Upload speed is bounded
    # by the connection — on hotel and mobile networks that's the real
    # constraint. To genuinely speed uploads up, shrink photos on the
    # device before adding them.
    #
    # upload_preset: travel_blog_upload

    # ------------------------------------------------------------------
    # DELIVERY: what visitors actually download.
    # ------------------------------------------------------------------
    #   - fetch_format: auto      → serve WebP/AVIF where supported, JPEG otherwise
    #   - quality: auto           → Cloudinary picks the smallest size with no visible loss
    #   - width: 1200, crop: limit → cap displayed width at 1200px (no upscaling)
    default_transformations:
      - - fetch_format: auto
          quality: auto
          width: 1200
          crop: limit

# Local fallback (only used if Cloudinary fails to load — should never trigger).
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# -----------------------------------------------------------------------------
# Collections — the kinds of content that can be edited from the admin.
# Two collections: trips (one per vacation) and posts (one per day).
# When you create a trip, it shows up in the Trip dropdown when you create
# posts — no code changes needed for new trips.
# -----------------------------------------------------------------------------
collections:

  # -------------------------------------------------------------------------
  # Site configuration — single-file edits for site-wide settings
  # -------------------------------------------------------------------------
  - name: "site-config"
    label: "Site Settings"
    description: "Quick edits to global site values."
    files:
      - file: "_data/status.yml"
        label: "Status bar (current location / next destination)"
        name: "status"
        fields:
          - { label: "Current location",
              name: "current_location",
              widget: "string",
              hint: "Shown in the top bar with a 📍 pin. Use 'Home' or leave blank to hide between trips." }
          - { label: "Current timezone",
              name: "current_timezone",
              widget: "string",
              required: false,
              default: "America/Los_Angeles",
              hint: "IANA timezone for the live clock. Use the 'TZ identifier' column on Wikipedia's list — format is Continent/City (NOT the country code or the 'Comments' column). Examples: America/Los_Angeles, America/New_York, Europe/Paris, Asia/Tokyo, Asia/Ho_Chi_Minh, Asia/Tbilisi." }
          - { label: "Next destination",
              name: "next_destination",
              widget: "string",
              required: false,
              hint: "Free-form text shown with a ✈️ icon. e.g. 'Tokyo, Japan — Sep 2026'. Leave blank to hide." }
          - { label: "Nomad start date",
              name: "nomad_start_date",
              widget: "datetime",
              required: false,
              format: "YYYY-MM-DD",
              time_format: false,
              date_format: "YYYY-MM-DD",
              hint: "The day the nomadic chapter began. Powers the live 'days on the road' clock on the Stats page. Leave blank to hide the clock." }

      - file: "_pages/about.md"
        label: "About page (text)"
        name: "about"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "About" }
          - { label: "Permalink", name: "permalink", widget: "hidden", default: "/about/" }
          - { label: "Layout", name: "layout", widget: "hidden", default: "about" }
          - { label: "Author profile", name: "author_profile", widget: "hidden", default: false }
          - label: "Body"
            name: "body"
            widget: "markdown"
            hint: "Write the about page content. Use the toolbar for formatting; drag photos in to upload."

      - file: "_data/favorites.yml"
        label: "Favorites page"
        name: "favorites"
        fields:
          - { label: "Intro paragraph",
              name: "intro",
              widget: "string",
              required: false }
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{fields.icon}} {{fields.name}}"
            fields:
              - { label: "Category name", name: "name", widget: "string", hint: "e.g. 'Best Food'" }
              - { label: "Icon emoji", name: "icon", widget: "string", required: false, hint: "Single emoji shown next to the title. e.g. 🍜" }
              - { label: "Short description", name: "description", widget: "string", required: false }
              - label: "Countries in this category"
                name: "entries"
                widget: "list"
                summary: "{{fields.country}}"
                required: false
                fields:
                  - { label: "Country / Place", name: "country", widget: "string" }
                  - { label: "Medal", name: "rank", widget: "select", required: false, options: ["", "gold", "silver", "bronze", "honorable"], hint: "Award a medal to this entry: gold 🥇, silver 🥈, bronze 🥉, or honorable ⭐. Leave blank for no medal. Medals are independent of list order, so you can reorder entries freely without changing the standings." }
                  - { label: "Linked trip slug", name: "trip_slug", widget: "string", required: false, hint: "If this country has a trip on the site, paste its slug (e.g. 'vietnam') to make the card clickable." }
                  - { label: "Cover photo", name: "cover", widget: "image", required: false, hint: "The photo that represents this choice — shown as the card image. Recommended for every entry." }
                  - { label: "Cover — focal X (0–100)", name: "cover_focal_x", widget: "number", required: false, value_type: "int", default: 50, min: 0, max: 100, hint: "Which part of the photo shows in the card. 50 = centered, 0 = far left, 100 = far right. Use the 🎯 Position Photo button (bottom-right) to drag it visually instead of guessing." }
                  - { label: "Cover — focal Y (0–100)", name: "cover_focal_y", widget: "number", required: false, value_type: "int", default: 50, min: 0, max: 100, hint: "0 = top of the photo, 100 = bottom." }
                  - { label: "Blurb (one line)", name: "blurb", widget: "string", required: false }

      - file: "_data/daydream.yml"
        label: "Daydreaming page"
        name: "daydream"
        fields:
          - { label: "Intro paragraph",
              name: "intro",
              widget: "string",
              required: false }
          - label: "Upcoming (booked/planned trips)"
            name: "upcoming"
            widget: "list"
            required: false
            default: []
            summary: "{{fields.country}} — {{fields.when}}"
            hint: "Trips we've actually got tickets/dates for. Shows at the TOP of /daydream/ under an 'Upcoming' header. Move to the wish list below when it becomes indefinite; move OUT entirely when it becomes a real trip in /admin/ → Trips."
            fields:
              - { label: "Country / Place", name: "country", widget: "string" }
              - { label: "Cover photo", name: "cover", widget: "image", required: false }
              - { label: "Cover — focal X (0–100)", name: "cover_focal_x", widget: "number", required: false, value_type: "int", default: 50, min: 0, max: 100, hint: "Which part of the photo shows in the card. 50 = centered. Use the 🎯 Position Photo button (bottom-right) to drag it visually." }
              - { label: "Cover — focal Y (0–100)", name: "cover_focal_y", widget: "number", required: false, value_type: "int", default: 50, min: 0, max: 100, hint: "0 = top of the photo, 100 = bottom." }
              - { label: "Why we're going", name: "why", widget: "string", required: false, hint: "One sentence on what we're looking forward to." }
              - { label: "When", name: "when", widget: "string", required: false, hint: "e.g. 'March 2027' or 'Booked for June'." }
          - label: "Wish list (in priority order)"
            name: "queue"
            widget: "list"
            summary: "{{fields.country}}"
            hint: "Longer-term hopes — no dates yet. Renders under the Upcoming section."
            fields:
              - { label: "Country / Place", name: "country", widget: "string" }
              - { label: "Cover photo", name: "cover", widget: "image", required: false }
              - { label: "Cover — focal X (0–100)", name: "cover_focal_x", widget: "number", required: false, value_type: "int", default: 50, min: 0, max: 100, hint: "Which part of the photo shows in the card. 50 = centered. Use the 🎯 Position Photo button (bottom-right) to drag it visually." }
              - { label: "Cover — focal Y (0–100)", name: "cover_focal_y", widget: "number", required: false, value_type: "int", default: 50, min: 0, max: 100, hint: "0 = top of the photo, 100 = bottom." }
              - { label: "Why we want to go", name: "why", widget: "string", required: false, hint: "One sentence on what's drawing us there." }
              - { label: "When (rough timing)", name: "when", widget: "string", required: false, hint: "e.g. 'Summer 2027' or 'Once the kids are older'." }

      - file: "_data/country_images.yml"
        label: "Country flag images"
        name: "country_images"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            required: false
            default: []
            summary: "{{fields.name}}"
            hint: "Add a country name + image URL. On /stats/ the chip for that country will show the image as a small rounded rectangle to the left of the name. Country name MUST match spelling used in your trip files (e.g. 'Vietnam', not 'Viet Nam') — use the same dropdown values from the Trip → Additional countries picker."
            fields:
              - { label: "Country name", name: "name", widget: "string", hint: "e.g. 'Vietnam', 'United Kingdom'. Case-sensitive; must match your trip data exactly." }
              - { label: "Image URL", name: "url", widget: "string", hint: "Must be a DIRECT image link starting with https://upload.wikimedia.org/ — NOT a wikipedia.org/wiki/File: page link (those show a webpage, not an image, so nothing renders). To get it: open the Wikipedia flag page, right-click the flag itself, choose 'Copy image address'. Example: https://upload.wikimedia.org/wikipedia/commons/thumb/2/21/Flag_of_Vietnam.svg/960px-Flag_of_Vietnam.svg.png" }

      - file: "_data/us_state_images.yml"
        label: "US state flag images"
        name: "us_state_images"
        fields:
          - label: "Entries"
            name: "entries"
            widget: "list"
            required: false
            default: []
            summary: "{{fields.name}}"
            hint: "Add a US state name + image URL. Same shape as the country version above, but keyed by full state name (e.g. 'California', 'New York')."
            fields:
              - { label: "State name", name: "name", widget: "string", hint: "e.g. 'California', 'New York'. Case-sensitive; must match your trip data exactly." }
              - { label: "Image URL", name: "url", widget: "string", hint: "Must be a DIRECT image link starting with https://upload.wikimedia.org/ — NOT a wikipedia.org/wiki/File: page link. Right-click the flag image itself and choose 'Copy image address'. Example: https://upload.wikimedia.org/wikipedia/commons/thumb/0/01/Flag_of_California.svg/960px-Flag_of_California.svg.png" }

      - file: "_data/records.yml"
        label: "Records & leaderboard"
        name: "records"
        fields:
          - { label: "Intro line",
              name: "intro",
              widget: "string",
              required: false,
              hint: "Short line under the Leaderboard heading on /stats/." }
          - label: "Records"
            name: "entries"
            widget: "list"
            summary: "{{fields.title}} — {{fields.value}}"
            hint: "Fun personal bests. 'Most countries in one year' is auto-computed — don't add it here manually. Every field is optional: leave an entry's Value blank to keep it here as a placeholder without showing it on the public Stats page."
            fields:
              - { label: "Title", name: "title", widget: "string", required: false, hint: "e.g. 'Most steps in one day'" }
              - { label: "Value", name: "value", widget: "string", required: false, hint: "The number or figure. Formatted freely, e.g. '42,382' or '3.5'. Leave blank and this record stays hidden from the site until you fill it in." }
              - { label: "Unit", name: "unit", widget: "string", required: false, hint: "e.g. 'steps', 'km', 'countries'." }
              - { label: "Where", name: "place", widget: "string", required: false, hint: "The city, country, or trip where the record was set." }
              - { label: "Date", name: "date", widget: "datetime", required: false, format: "YYYY-MM-DD", time_format: false, date_format: "YYYY-MM-DD" }
              - { label: "Note", name: "note", widget: "string", required: false, hint: "Details shown in small text under the value. e.g. 'Plane, Car, Bike, Walk, Bus, Train'." }
              - { label: "Icon emoji", name: "icon", widget: "string", required: false, hint: "Single emoji shown on the record card. e.g. 👣 🚆 🏔️. Defaults to ⭐." }

      - file: "_data/lessons.yml"
        label: "Lessons page"
        name: "lessons"
        fields:
          - { label: "Intro paragraph",
              name: "intro",
              widget: "string",
              required: false,
              hint: "Shown at the top of the /lessons/ page under the Rick Steves quote." }
          - label: "Reflections & goals"
            name: "entries"
            widget: "list"
            summary: "{{fields.topic}}"
            hint: "Each entry captures how our view on a topic has evolved. Add updates over time as our thinking shifts."
            fields:
              - { label: "Topic",
                  name: "topic",
                  widget: "string",
                  hint: "e.g. 'Living out of a backpack' or 'Vietnam' or 'Learning a language on the road'." }
              - { label: "Example only? (hides from public page — used as a reference)",
                  name: "example",
                  widget: "boolean",
                  default: false,
                  required: false,
                  hint: "Turn ON for template/example entries — they'll only be visible here in the editor, not on the public site." }
              - { label: "Category",
                  name: "category",
                  widget: "select",
                  required: false,
                  options: ["Country", "City", "Life on the road", "Relationships", "Health & fitness", "Money", "Food", "Goal", "Other"],
                  hint: "Broad grouping shown as a pill on the card." }
              - { label: "Status",
                  name: "status",
                  widget: "select",
                  required: false,
                  default: "evolved",
                  options: ["evolved", "loved", "in_progress", "achieved", "pivoted", "abandoned"],
                  hint: "Shown as a colored badge on the card. 'evolved' is the default for reflections; the others are useful for goals." }
              - { label: "Before we left",
                  name: "before",
                  widget: "markdown",
                  required: false,
                  hint: "What we thought / expected before this experience. Full editor — drag in photos, add links, use the 😊 emoji button." }
              - label: "Updates along the way"
                name: "updates"
                widget: "list"
                required: false
                summary: "{{fields.date}}"
                hint: "Dated thoughts as our view shifts. Add one whenever we notice our thinking changed."
                fields:
                  - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false, date_format: "YYYY-MM-DD" }
                  - { label: "Thought", name: "thought", widget: "markdown", hint: "Full editor — photos, links and emojis all work here." }
              - { label: "Where we've landed (current view)",
                  name: "current",
                  widget: "markdown",
                  required: false,
                  hint: "The distilled current take, shown in a highlighted box at the bottom of the card. Full editor — photos, links and emojis all work." }

  # -------------------------------------------------------------------------
  # Trips collection — one entry per vacation.
  # Each trip becomes a page at /<slug>/ showing its day-by-day post list.
  # -------------------------------------------------------------------------
  - name: "trips"
    label: "Trips"
    label_singular: "Trip"
    description: "One entry per vacation. Add a trip first, then create day posts and assign them to it."
    folder: "_trips"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{title}} · {{location}}"
    sortable_fields: ['start_date', 'title']
    fields:
      - { label: "Trip name",
          name: "title",
          widget: "string",
          hint: "e.g. 'Iceland 2024'. The URL will be auto-generated from this — keep it short and recognizable." }

      - { label: "One-sentence description",
          name: "description",
          widget: "string",
          hint: "Shown on the homepage card and in listings." }

      - { label: "Cover photo",
          name: "cover",
          widget: "image",
          hint: "Drag in the photo that represents this whole trip — used as the card image on the homepage." }

      - { label: "Cover — focal X (0–100)",
          name: "cover_focal_x",
          widget: "number",
          required: false,
          value_type: "int",
          default: 50,
          min: 0,
          max: 100,
          hint: "Set automatically by the 🎯 Position Photo tool (floating button bottom-right). 50 = centered. Don't edit by hand unless you know what you want." }

      - { label: "Cover — focal Y (0–100)",
          name: "cover_focal_y",
          widget: "number",
          required: false,
          value_type: "int",
          default: 50,
          min: 0,
          max: 100 }

      - { label: "Start date",
          name: "start_date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          date_format: "YYYY-MM-DD" }

      - { label: "End date",
          name: "end_date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          date_format: "YYYY-MM-DD" }

      - { label: "Location (region/country)",
          name: "location",
          widget: "string",
          hint: "e.g. 'Iceland', 'Tokyo, Japan'. Shown on the card and used by the 'sort by location' option." }

      - { label: "Map pin — Latitude",
          name: "lat",
          widget: "number",
          required: false,
          value_type: "float",
          hint: "Where to place this trip's pin on the world map. Get from latlong.net. Optional but recommended." }

      - { label: "Map pin — Longitude",
          name: "lng",
          widget: "number",
          required: false,
          value_type: "float" }

      - label: "Additional countries (multi-country trip)"
        name: "countries"
        widget: "list"
        required: false
        collapsed: true
        summary: "{{fields.name}}"
        hint: "For trips that span multiple countries, add a pin per country. Each pin appears on the world map and clicks through to this same trip page. Get coords from latlong.net (country center is usually fine)."
        fields:
          - label: "Country name"
            name: "name"
            widget: "select"
            hint: "Type to search all 195 UN countries. Matching the exact spelling here ensures the country appears on the world coverage map and continent tally on /stats/."
            options:
              - "Afghanistan"
