  # -------------------------------------------------------------------------
  # Posts collection — one entry per day of a trip.
  # -------------------------------------------------------------------------
  - name: "posts"
    label: "Travel Posts"
    label_singular: "Travel Post"
    description: "Each day's blog entry. Pick the trip, set the day order, write away."
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}} · {{commit_date | date('YYYY-MM-DD')}}"
    sortable_fields: ['date', 'title', 'order']
    # Group-by is DYNAMIC — Decap builds one group per distinct value of
    # `categories`, so new trips appear here automatically with no config
    # edit. Use "Group by → Trip" in the editor sidebar.
    view_groups:
      - label: "Trip"
        field: categories

    # Quick one-click filters. Decap can't build these dynamically, so the
    # list has to be spelled out — but nobody has to maintain it by hand:
    # scripts/sync_trip_filters.py regenerates everything between the markers
    # from _trips/, and GitHub Actions runs it whenever a trip is added or
    # renamed. Don't edit inside the markers; the next run overwrites it.
    view_filters:
      # --- BEGIN generated trip filters (scripts/sync_trip_filters.py) ---
      - label: "African Safari Sojourn"
        field: categories
        pattern: "african-safari"
      - label: "Bamboo & Bulgogi Bliss"
        field: categories
        pattern: "bamboo-bulgogi"
      - label: "Between Mountains & Monasteries ⛰️🏰"
        field: categories
        pattern: "between-mountains-monasteries-⛰️🏰"
      - label: "Cafes, Tango, & Time"
        field: categories
        pattern: "cafes-tango-time"
      - label: "Canyons & Cairns"
        field: categories
        pattern: "canyons-cairns"
      - label: "City of Empires"
        field: categories
        pattern: "city-of-empires"
      - label: "European Excursion"
        field: categories
        pattern: "european-excursion"
      - label: "European Exploration"
        field: categories
        pattern: "european-exploration"
      - label: "Fjords & Forever"
        field: categories
        pattern: "fjords-forever"
      - label: "Life in the Big City"
        field: categories
        pattern: "life-in-the-big-city"
      - label: "Mantas, Guac, and Glow 🚢🥽⚓🐠"
        field: categories
        pattern: "our-first-cruise-🚢🥽⚓🪼"
      - label: "Nomadic New Zealand Adventure 2022"
        field: categories
        pattern: "new-zealand"
      - label: "Party in the USA"
        field: categories
        pattern: "party-in-the-usa"
      - label: "Peruvian Passage"
        field: categories
        pattern: "peruvian-passage"
      - label: "Pura Vida Pursuit"
        field: categories
        pattern: "pura-vida-pursuit"
      - label: "Red Coats & Red Buses"
        field: categories
        pattern: "red-coats-red-buses"
      - label: "Rockies to Rapids"
        field: categories
        pattern: "rockies-to-rapids"
      - label: "Sharks, Shaved Ice, and Summits"
        field: categories
        pattern: "sharks-shaved-ice-and-summits"
      - label: "Snowed-In Alaska"
        field: categories
        pattern: "snowed-in-alaska"
      - label: "Tacos & Turrets in Mexico City"
        field: categories
        pattern: "tacos-turrets-in-mexico-city"
      - label: "The Singaporean Stopover"
        field: categories
        pattern: "the-singaporean-stopover"
      - label: "Vietnamese Voyage"
        field: categories
        pattern: "vietnam"
      - label: "Welcome Home: Tbilisi, Georgia"
        field: categories
        pattern: "welcome-home-tbilisi-georgia"
      # --- END generated trip filters ---
    fields:
      - { label: "Title",
          name: "title",
          widget: "string",
          hint: "The headline of the post — e.g. 'Day 3 — The South Coast'." }

      - { label: "Date",
          name: "date",
          widget: "datetime",
          format: "YYYY-MM-DD",
          time_format: false,
          date_format: "YYYY-MM-DD" }

      - label: "Trip"
        name: "categories"
        widget: "relation"
        collection: "trips"
        search_fields: ["title", "location"]
        value_field: "{{slug}}"
        display_fields: ["title"]
        multiple: true
        min: 1
        max: 1
        options_length: 100
        hint: "Pick which trip this post belongs to. New trips you create show up here automatically."

      - { label: "Day order in trip",
          name: "order",
          widget: "number",
          value_type: "float",
          min: 0,
          step: 0.1,
          hint: "The post's place in the trip. 1 = day 1, 2 = day 2. For two or more posts from the SAME day, use decimals: 15.1, 15.2, 15.3. They all still show as Day 15, but they stay in the order you chose instead of shuffling. Every post in a trip needs its own number — /admin-stats/ lists any that clash." }

      - label: "Cover & banner"
        name: "header"
        widget: "object"
        hint: "The big photo at the top of the post and the thumbnail in listings."
        fields:
          - { label: "Teaser (small thumbnail in listings)",
              name: "teaser",
              widget: "image" }
          - { label: "Teaser — focal X (0–100)",
              name: "teaser_focal_x",
              widget: "number",
              required: false,
              value_type: "int",
              default: 50,
              min: 0,
              max: 100,
              hint: "Set automatically by the 🎯 Position Photo tool (floating button bottom-right). 50 = centered." }
          - { label: "Teaser — focal Y (0–100)",
              name: "teaser_focal_y",
              widget: "number",
              required: false,
              value_type: "int",
              default: 50,
              min: 0,
              max: 100 }
          - { label: "Banner (large image at top of post)",
              name: "overlay_image",
              widget: "image" }
          - { label: "Banner — focal X (0–100)",
              name: "overlay_focal_x",
              widget: "number",
              required: false,
              value_type: "int",
              default: 50,
              min: 0,
              max: 100,
              hint: "Set automatically by the 🎯 Position Photo tool. 50 = centered." }
          - { label: "Banner — focal Y (0–100)",
              name: "overlay_focal_y",
              widget: "number",
              required: false,
              value_type: "int",
              default: 50,
              min: 0,
              max: 100 }
          - { label: "Banner darkening (0–1)",
              name: "overlay_filter",
              widget: "number",
              value_type: "float",
              default: 0.4,
              min: 0,
              max: 1,
              step: 0.1,
              hint: "0 = no darkening, 1 = fully black. Higher numbers make the title text more readable on bright photos." }

      - label: "Tags"
        name: "tags"
        # See the Tags field on the trips collection for why this is a select
        # rather than a relation.
        widget: "select"
        multiple: true
        required: false
        default: []
        # Generated from _data/tags.yml by scripts/sync_tag_options.py.
